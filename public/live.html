<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Silkscreen&family=Pixelify+Sans&family=DotGothic16&display=swap" rel="stylesheet">
<style>
@keyframes slideIn{0%{opacity:0;transform:translateY(20px) scale(.97)}100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes fadeOut{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-10px) scale(.95)}}
@keyframes badgePop{0%{transform:scale(0)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes flagAnim{0%{background-position:0% 50%}100%{background-position:100% 50%}}
@keyframes panelSlide{0%{transform:translateX(100%)}100%{transform:translateX(0)}}
.flag-text{background-size:200% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:flagAnim 3s linear infinite}
*{margin:0;padding:0;box-sizing:border-box}:root{--text-size:14px}
body{background:transparent;font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif;overflow:hidden;height:100vh;transition:background .3s}
#messages{display:flex;flex-direction:column;gap:6px;padding:16px;height:100vh;overflow:hidden;justify-content:flex-end}
.msg{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;background:rgba(13,17,23,0.75);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(48,54,61,0.5);animation:slideIn .4s cubic-bezier(.16,1,.3,1) forwards;transition:border-radius .3s,background .3s}
.msg .user{font-weight:700;font-size:var(--text-size);flex-shrink:0}
.msg .text{font-size:var(--text-size);color:#e6edf3;word-break:break-word;flex:1;line-height:1.4}
.msg .reply-indicator{font-size:calc(var(--text-size) * 0.85);color:#8b949e;display:flex;align-items:center;gap:4px;flex-shrink:0}
.msg .reply-indicator::before{content:'↩'}
.msg .reply-indicator .ru{color:#58a6ff;font-weight:600}
.msg .time{font-size:calc(var(--text-size) * 0.78);color:#484f58;flex-shrink:0}
.msg .effect-tag{font-size:calc(var(--text-size) * 0.7);color:#8b949e;margin-left:4px;cursor:pointer;border-bottom:1px dotted #555}
.msg .badge{font-size:calc(var(--text-size) * 0.64);font-weight:700;padding:2px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.5px;animation:badgePop .3s cubic-bezier(.34,1.56,.64,1) .1s both;flex-shrink:0}
.badge-twitch{background:linear-gradient(135deg,#9147ff,#772ce8);color:#fff;box-shadow:0 0 8px rgba(145,71,255,.4)}
.badge-youtube{background:linear-gradient(135deg,#ff0033,#cc0000);color:#fff;box-shadow:0 0 8px rgba(255,0,51,.4)}
.badge-discord{background:linear-gradient(135deg,#5865f2,#4752c4);color:#fff;box-shadow:0 0 8px rgba(88,101,242,.4)}
.badge-custom,.badge-bonebrg{background:#fff;color:#000;box-shadow:0 0 8px rgba(255,255,255,.3)}
.twitch-emote{vertical-align:middle;width:28px;height:28px;display:inline-block}
@media(prefers-reduced-motion:reduce){.msg{animation:none}.msg .badge{animation:none}.flag-text{animation:none}}

#settings-toggle{position:fixed;bottom:16px;right:16px;width:40px;height:40px;border-radius:50%;background:rgba(13,17,23,.8);border:1px solid rgba(48,54,61,.5);color:#8b949e;font-size:20px;cursor:pointer;display:none;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(8px);transition:color .2s,background .2s}
#settings-toggle:hover{color:#e6edf3;background:rgba(22,27,34,.9)}
#settings-toggle.show{display:flex}
#settings-panel{position:fixed;top:0;right:0;width:340px;height:100vh;background:rgba(13,17,23,.95);backdrop-filter:blur(12px);border-left:1px solid rgba(48,54,61,.5);z-index:200;display:none;flex-direction:column;animation:panelSlide .3s cubic-bezier(.16,1,.3,1)}
#settings-panel.show{display:flex}
#settings-panel .panel-header{display:flex;align-items:center;justify-content:space-between;padding:16px;border-bottom:1px solid #30363d;flex-shrink:0}
#settings-panel .panel-header h2{font-size:15px;color:#e6edf3;font-weight:700}
#settings-panel .panel-close{background:none;border:none;color:#8b949e;font-size:22px;cursor:pointer;padding:0 4px}
#settings-panel .panel-close:hover{color:#f85149}
#settings-panel .panel-body{flex:1;overflow-y:auto;padding:12px 16px 24px}
#settings-panel section{margin-bottom:20px}
#settings-panel section h3{font-size:13px;color:#8b949e;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid #21262d}
#settings-panel .setting{display:flex;align-items:center;justify-content:space-between;padding:6px 0;gap:12px}
#settings-panel .setting label{font-size:13px;color:#e6edf3;flex:1}
#settings-panel .setting input[type=color]{width:36px;height:30px;padding:0;border:1px solid #30363d;border-radius:4px;cursor:pointer;background:0;flex-shrink:0}
#settings-panel .setting select{background:#0d1117;color:#e6edf3;border:1px solid #30363d;border-radius:4px;padding:4px 8px;font-size:12px;max-width:130px}
#settings-panel .setting input[type=text]{background:#0d1117;color:#e6edf3;border:1px solid #30363d;border-radius:4px;padding:4px 8px;font-size:12px;flex:1;max-width:180px}
.toggle-switch{position:relative;width:36px;height:20px;flex-shrink:0;cursor:pointer}
.toggle-switch input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;inset:0;background:#30363d;border-radius:10px;transition:.2s}
.toggle-slider::before{content:'';position:absolute;width:16px;height:16px;border-radius:50%;background:#8b949e;top:2px;left:2px;transition:.2s}
.toggle-switch input:checked+.toggle-slider{background:#238636}
.toggle-switch input:checked+.toggle-slider::before{background:#fff;transform:translateX(16px)}
.ban-input{width:100%!important;max-width:100%!important;margin-top:4px}
.reset-btn{padding:8px 16px;background:#da3633;color:#fff;border:none;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;width:100%}
.reset-btn:hover{background:#f85149}
</style>
</head>
<body>
<div id="messages"></div>
<button id="settings-toggle" title="Display settings">⚙</button>
<div id="settings-panel">
  <div class="panel-header">
    <h2>Display Settings</h2>
    <button class="panel-close" id="settings-close">&times;</button>
  </div>
  <div class="panel-body">
    <section>
      <h3>Interface / Basic</h3>
      <div class="setting"><label>Background color</label><input type="color" id="s-bg" value="#000000"></div>
      <div class="setting"><label>Transparent for OBS</label><label class="toggle-switch"><input type="checkbox" id="s-obs"><span class="toggle-slider"></span></label></div>
      <div class="setting"><label>Show chat source badges</label><label class="toggle-switch"><input type="checkbox" id="s-badges" checked><span class="toggle-slider"></span></label></div>
      <div class="setting"><label>Use custom font styles</label><label class="toggle-switch"><input type="checkbox" id="s-fonts" checked><span class="toggle-slider"></span></label></div>
      <div class="setting"><label>Use user message backgrounds</label><label class="toggle-switch"><input type="checkbox" id="s-user-bg" checked><span class="toggle-slider"></span></label></div>
      <div class="setting"><label>Text size: <span id="s-text-size-val">14</span>px</label><input type="range" id="s-text-size" min="8" max="30" value="14" step="1"></div>
    </section>
    <section>
      <h3>Chat Bubbles</h3>
      <div class="setting"><label>Bubble background mode</label><select id="s-bubble-bg-mode"><option value="fill">Fill rectangle</option><option value="text">Beneath text</option><option value="none">No background</option></select></div>
      <div class="setting"><label>Show bubble background</label><label class="toggle-switch"><input type="checkbox" id="s-bubble-bg" checked><span class="toggle-slider"></span></label></div>
      <div class="setting"><label>Twitch username color</label><label class="toggle-switch"><input type="checkbox" id="s-twitch-color" checked><span class="toggle-slider"></span></label></div>
      <div class="setting"><label>Use user custom colors</label><label class="toggle-switch"><input type="checkbox" id="s-user-color" checked><span class="toggle-slider"></span></label></div>
      <div class="setting" id="s-twitch-fallback-row" style="display:none"><label>Twitch fallback color</label><input type="color" id="s-twitch-fallback" value="#e6edf3"></div>
      <div class="setting"><label>YouTube username color</label><input type="color" id="s-yt-color" value="#ff0033"></div>
      <div class="setting"><label>Linked account color</label><input type="color" id="s-link-color" value=""></div>
      <div class="setting"><label>Gradient text</label><label class="toggle-switch"><input type="checkbox" id="s-link-gradient"><span class="toggle-slider"></span></label></div>
      <div class="setting" id="s-link-color2-row" style="display:none"><label>Gradient end color</label><input type="color" id="s-link-color2" value="#58a6ff"></div>
      <div class="setting"><label>Disable chat animations</label><label class="toggle-switch"><input type="checkbox" id="s-no-anim"><span class="toggle-slider"></span></label></div>
      <div class="setting"><label>Show message time</label><label class="toggle-switch"><input type="checkbox" id="s-time"><span class="toggle-slider"></span></label></div>
      <div class="setting"><label>Message lifetime (seconds)</label><select id="s-msg-life"><option value="4">4s</option><option value="8">8s</option><option value="15">15s</option><option value="30">30s</option><option value="0">Never</option></select></div>
      <div class="setting"><label>Bubble background color</label><input type="color" id="s-bubble-color" value="#0d1117"></div>
      <div class="setting"><label>Bubble shape</label><select id="s-bubble-shape"><option value="rounded">Rounded</option><option value="circle">Circle</option><option value="square">Square</option></select></div>
    </section>
    <section>
      <h3>Chats</h3>
      <div class="setting"><label>Twitch</label><label class="toggle-switch"><input type="checkbox" id="s-src-twitch" checked><span class="toggle-slider"></span></label></div>
      <div class="setting"><label>YouTube</label><label class="toggle-switch"><input type="checkbox" id="s-src-youtube" checked><span class="toggle-slider"></span></label></div>
      <div class="setting"><label>Discord</label><label class="toggle-switch"><input type="checkbox" id="s-src-discord"><span class="toggle-slider"></span></label></div>
      <div class="setting"><label>BoneBridge</label><label class="toggle-switch"><input type="checkbox" id="s-src-custom" checked><span class="toggle-slider"></span></label></div>
    </section>
    <section>
      <h3>Banlist</h3>
      <div class="setting"><label>Banned users (space separated)</label><input type="text" class="ban-input" id="s-banlist" placeholder="user1 user2"></div>
    </section>
    <section>
      <h3>Advanced</h3>
      <button class="reset-btn" id="s-reset">Reset all settings to default</button>
      <p style="text-align:center;color:#484f58;font-size:11px;margin-top:16px">fub js so you know, you're like, awesome, seriously</p>
    </section>
  </div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const messagesEl = document.getElementById('messages');
const MAX_VISIBLE = 30;
const emoteMap = new Map();
let emotesLoaded = false;

function renderTextWithEmotes(text, nativeEmotes) {
  const nodes = [];
  const replacements = [];
  
  // 1. Pinpoint exact Twitch emotes using the provided indexes
  if (nativeEmotes) {
    for (const [id, positions] of Object.entries(nativeEmotes)) {
      for (const pos of positions) {
        const [start, end] = pos.split('-').map(Number);
        replacements.push({
          start,
          end: end + 1,
          url: `https://static-cdn.jtvnw.net/emoticons/v2/${id}/default/dark/1.0`,
          name: text.substring(start, end + 1)
        });
      }
    }
  }
  
  // Sort them so we parse the string left-to-right properly
  replacements.sort((a, b) => a.start - b.start);
  
  let currentIndex = 0;
  
  // Helper to check for 3rd-party emotes in the normal text chunks
  function parseThirdParty(chunk) {
    const parts = chunk.split(/(\s+)/);
    for (const part of parts) {
      if (!part) continue;
      const key = part.toLowerCase();
      if (emoteMap.has(key)) {
        const img = document.createElement('img');
        img.src = emoteMap.get(key);
        img.alt = part;
        img.style.cssText = 'vertical-align:middle;width:28px;height:28px;display:inline-block';
        nodes.push(img);
      } else {
        nodes.push(document.createTextNode(part));
      }
    }
  }

  // 2. Rebuild the message node by node
  for (const rep of replacements) {
    if (rep.start > currentIndex) {
      parseThirdParty(text.substring(currentIndex, rep.start));
    }
    
    const img = document.createElement('img');
    img.src = rep.url;
    img.alt = rep.name;
    img.style.cssText = 'vertical-align:middle;width:28px;height:28px;display:inline-block';
    nodes.push(img);
    
    currentIndex = rep.end;
  }
  
  if (currentIndex < text.length) {
    parseThirdParty(text.substring(currentIndex));
  }
  
  return nodes.length ? nodes : [document.createTextNode(text)];
}

function reRenderEmotes() {
  document.querySelectorAll('.msg .text').forEach(el => {
    const txt = el.textContent || el.innerText;
    el.innerHTML = '';
    el.append(...renderTextWithEmotes(txt));
  });
}

async function loadEmotes() {
  const sources = [
    fetch('https://api.frankerfacez.com/v1/set/global').then(r=>r.json()).then(d => {
      for (const set of Object.values(d.sets || {}))
        for (const em of set.emoticons || [])
          emoteMap.set(em.name.toLowerCase(), `https:${em.urls['1']||em.urls['2']||em.urls['4']||''}`);
    }).catch(()=>{}),
    fetch('https://api.betterttv.net/3/cached/emotes/global').then(r=>r.json()).then(d => {
      for (const em of d || [])
        emoteMap.set(em.code.toLowerCase(), `https://cdn.betterttv.net/emote/${em.id}/2x`);
    }).catch(()=>{}),
    fetch('https://api.frankerfacez.com/v1/room/mrpemmfub').then(r=>r.json()).then(d => {
      if (d && d.sets)
        for (const set of Object.values(d.sets))
          for (const em of set.emoticons || [])
            emoteMap.set(em.name.toLowerCase(), `https:${em.urls['1']||em.urls['2']||em.urls['4']||''}`);
    }).catch(()=>{})
  ];
  const userId = await fetch('https://decapi.me/twitch/id/mrpemmfub').then(r=>r.text()).catch(()=>null);
  if (userId) {
    sources.push(
      fetch(`https://api.betterttv.net/3/cached/users/twitch/${userId}`).then(r=>r.json()).then(d => {
        for (const em of d.channelEmotes || [])
          emoteMap.set(em.code.toLowerCase(), `https://cdn.betterttv.net/emote/${em.id}/2x`);
        for (const em of d.sharedEmotes || [])
          emoteMap.set(em.code.toLowerCase(), `https://cdn.betterttv.net/emote/${em.id}/2x`);
      }).catch(()=>{})
    );
  }
  await Promise.all(sources);
  emotesLoaded = true;
  reRenderEmotes();
}
loadEmotes();
const EFFECT_DURATION = 5000;
const FADE_DURATION = 1000;
const flags = {
  pride: ['#ff0000','#ff8c00','#ffff00','#008000','#0000ff','#4b0082','#8b00ff'],
  trans: ['#55cdfc','#f7a8b8','#fff','#f7a8b8','#55cdfc'],
  bi: ['#d60270','#d60270','#9b4f96','#0038a8','#0038a8'],
  pan: ['#ff218c','#ffd800','#21b1ff'],
  nb: ['#fcf434','#fff','#9c59d1','#2c2c2c'],
  lesbian: ['#d52d00','#ef7627','#ff9a56','#fff','#d162a4','#b55690','#a30262'],
  ace: ['#000','#a4a4a4','#fff','#810081'],
  aro: ['#3da542','#a7d379','#fff','#a7d379','#3da542'],
  mlm: ['#078585','#98e8e8','#fff','#98e8e8','#078585'],
  genderfluid: ['#ff76a4','#fff','#bf11d','#000','#303cbe'],
  agender: ['#000','#bababa','#fff','#baf484','#fff','#bababa','#000']
};

const DEFAULT_SETTINGS = {
  bg:'#000000', badges:true, fonts:true, userBg:true, obsTransparent:true, textSize:14,
  bubbleBgMode:'fill', showBubbleBg:true, twitchColor:true, userColor:true, twitchFallback:'#e6edf3', ytColor:'#ff0033',
  linkColor:'', linkColor2:'', linkGradient:false,
  noAnim:false, showTime:false, msgLife:8, bubbleColor:'#0d1117', bubbleShape:'rounded',
  srcTwitch:true, srcYoutube:true, srcDiscord:false, srcCustom:true,
  banlist:''
};

let settings = (() => {
  try { return {...DEFAULT_SETTINGS, ...JSON.parse(localStorage.getItem('liveSettings')||'{}')}; } catch { return {...DEFAULT_SETTINGS}; }
})();

function saveSettings() { localStorage.setItem('liveSettings', JSON.stringify(settings)); }

function applySettings() {
  document.body.style.background = settings.obsTransparent ? 'transparent' : settings.bg;
  document.documentElement.style.setProperty('--text-size', settings.textSize + 'px');
  document.documentElement.style.setProperty('--bubble-color', settings.bubbleColor);
  document.documentElement.style.setProperty('--bubble-radius',
    settings.bubbleShape === 'circle' ? '50px' : settings.bubbleShape === 'square' ? '0' : '10px');
  document.documentElement.style.setProperty('--bubble-bg-mode',
    settings.bubbleBgMode === 'none' ? 'transparent' : settings.showBubbleBg ? settings.bubbleColor : 'transparent');
  // re-style existing messages
  document.querySelectorAll('.msg').forEach(el => {
    const m = el._msg || {};
    const sk = srcKey(m.source);
    const banned = isBanned(m.username || '');
    el.style.display = (sk && !settings[sk]) || banned ? 'none' : '';

    el.style.background = settings.showBubbleBg && settings.bubbleBgMode !== 'none' ? settings.bubbleColor : 'transparent';
    el.style.borderRadius = document.documentElement.style.getPropertyValue('--bubble-radius');
    el.style.border = settings.showBubbleBg ? '1px solid rgba(48,54,61,0.5)' : 'none';
    el.style.boxShadow = settings.showBubbleBg ? '' : 'none';
    if (settings.noAnim || !settings.showBubbleBg) el.style.animation = 'none';

    el.querySelectorAll('.badge').forEach(b => b.style.display = settings.badges ? '' : 'none');
    el.querySelectorAll('.time').forEach(t => t.style.display = settings.showTime ? '' : 'none');

    const user = el.querySelector('.user');
    if (user) {
      user.style.background = '';
      user.style.webkitTextFillColor = '';
      user.style.color = '';
      if (m.userColor && settings.userColor) {
        if (m.userColor.gradient && m.userColor.color2) {
          user.style.background = `linear-gradient(90deg, ${m.userColor.color}, ${m.userColor.color2})`;
          user.style.webkitBackgroundClip = 'text';
          user.style.webkitTextFillColor = 'transparent';
          user.style.backgroundClip = 'text';
        } else {
          user.style.color = m.userColor.color;
        }
      } else if (m.linked && settings.linkColor) {
        applyLinkedColor(user);
      } else {
        if (m.source === 'twitch' && m.color && settings.twitchColor) user.style.color = m.color;
        else if (m.source === 'twitch') user.style.color = settings.twitchFallback;
        if (m.source === 'youtube') user.style.color = settings.ytColor;
      }
    }

    const text = el.querySelector('.text');
    if (text) {
      if (m.font && settings.fonts) applyFontStyle(text, m.font);
      else text.style.cssText = '';
    }
  });
}

function stripMeta(text) {
  const s = text.indexOf('\u200D'); if(s===-1)return text;
  const e = text.lastIndexOf('\u200D'); if(e===-1||e<=s)return text;
  return text.slice(0,s)+text.slice(e+1);
}

function applyLinkedColor(userEl) {
  if (!settings.linkColor) return;
  if (settings.linkGradient && settings.linkColor2) {
    userEl.style.background = `linear-gradient(90deg, ${settings.linkColor}, ${settings.linkColor2})`;
    userEl.style.webkitBackgroundClip = 'text';
    userEl.style.webkitTextFillColor = 'transparent';
    userEl.style.backgroundClip = 'text';
  } else {
    userEl.style.color = settings.linkColor;
    userEl.style.background = '';
    userEl.style.webkitTextFillColor = '';
  }
}
function applyFontStyle(el, f) {
  const ol = f.ol > 0 ? `${f.ol}px solid ${f.olc}` : 'none';
  const hasShadow = f.shx || f.shy || f.shb;
  const sh = hasShadow ? `${f.shx||0}px ${f.shy||0}px ${f.shb||0}px ${f.shc}${f.sho < 100 ? Math.round(f.sho*2.55).toString(16).padStart(2,'0') : ''}` : 'none';
  el.style.cssText = `font-family:${f.fn};color:${f.fc||'#e6edf3'};-webkit-text-stroke:${ol};text-shadow:${sh}`;
  el.style.background = settings.userBg && f.bg ? f.bg : 'transparent';
}

function stopEffect(el) {
  if (el._effectTimer) { cancelAnimationFrame(el._effectTimer); el._effectTimer = null; }
}

function applyWave(el, text) {
  stopEffect(el);
  el.innerHTML = '';
  const spans = [];
  for (let i = 0; i < text.length; i++) {
    const sp = document.createElement('span');
    sp.textContent = text[i] === ' ' ? '\u00A0' : text[i];
    sp.style.display = 'inline-block';
    el.appendChild(sp); spans.push(sp);
  }
  const startTime = performance.now();
  function frame(t) {
    const elapsed = t - startTime;
    const remaining = Math.max(0, EFFECT_DURATION - elapsed);
    const amp = 5 * Math.min(remaining / FADE_DURATION, 1);
    for (let i = 0; i < spans.length; i++) {
      const phase = (elapsed / 1000 + i * 0.08) / 0.4 * Math.PI * 2;
      spans[i].style.transform = `translateY(${Math.sin(phase) * amp}px)`;
    }
    if (elapsed < EFFECT_DURATION) el._effectTimer = requestAnimationFrame(frame);
    else el.innerHTML = text;
  }
  el._effectTimer = requestAnimationFrame(frame);
}

function applyRainbow(el, text) {
  stopEffect(el);
  el.innerHTML = '';
  const spans = [];
  for (let i = 0; i < text.length; i++) {
    const sp = document.createElement('span');
    sp.textContent = text[i] === ' ' ? '\u00A0' : text[i];
    el.appendChild(sp); spans.push(sp);
  }
  const startTime = performance.now();
  function frame(t) {
    const elapsed = t - startTime;
    const remaining = Math.max(0, EFFECT_DURATION - elapsed);
    const fade = Math.min(remaining / FADE_DURATION, 1);
    const sat = 100 * fade + '%';
    const light = 35 + 20 * fade;
    for (let i = 0; i < spans.length; i++) {
      const hue = ((i / spans.length) * 360 + elapsed / 1000 * 120) % 360;
      spans[i].style.color = `hsl(${hue}, ${sat}, ${light}%)`;
    }
    if (elapsed < EFFECT_DURATION) el._effectTimer = requestAnimationFrame(frame);
    else el.innerHTML = text;
  }
  el._effectTimer = requestAnimationFrame(frame);
}

function applyFlag(el, text, fname) {
  stopEffect(el);
  const cols = flags[fname] || flags.pride;
  el.innerHTML = '';
  const spans = [];
  for (let i = 0; i < text.length; i++) {
    const sp = document.createElement('span');
    sp.textContent = text[i] === ' ' ? '\u00A0' : text[i];
    el.appendChild(sp); spans.push(sp);
  }
  const startTime = performance.now();
  function frame(t) {
    const elapsed = t - startTime;
    const remaining = Math.max(0, EFFECT_DURATION - elapsed);
    const fade = Math.min(remaining / FADE_DURATION, 1);
    const offset = Math.floor(elapsed / 300) % cols.length;
    for (let i = 0; i < spans.length; i++) {
      const ci = (i + offset) % cols.length;
      spans[i].style.color = cols[ci];
      spans[i].style.opacity = fade;
    }
    if (elapsed < EFFECT_DURATION) el._effectTimer = requestAnimationFrame(frame);
    else el.innerHTML = text;
  }
  el._effectTimer = requestAnimationFrame(frame);
}

function isBanned(username) {
  if (!settings.banlist) return false;
  return settings.banlist.split(/\s+/).some(b => b.toLowerCase() === username.toLowerCase());
}

function srcKey(source) {
  if (source === 'twitch') return 'srcTwitch';
  if (source === 'youtube') return 'srcYoutube';
  if (source === 'discord') return 'srcDiscord';
  if (source === 'custom') return 'srcCustom';
  return null;
}

function updatePlaceholder() {
  let el = document.getElementById('placeholder');
  if (messagesEl.children.length === 0 || (messagesEl.children.length === 1 && el)) {
    if (!el) {
      el = document.createElement('div');
      el.id = 'placeholder';
      el.className = 'msg';
      el.style.cssText = 'opacity:0.4;user-select:none';
      const b = document.createElement('span');
      b.className = 'badge badge-custom';
      b.textContent = 'BONEBRG';
      el.appendChild(b);
      const u = document.createElement('span');
      u.className = 'user';
      u.textContent = 'Alas:';
      u.style.color = '#e6edf3';
      el.appendChild(u);
      const t = document.createElement('span');
      t.className = 'text';
      t.textContent = 'Hello world, programmed to work and not to think, not even sure that this is real... Hello world.';
      el.appendChild(t);
    }
    if (!el.parentNode) messagesEl.appendChild(el);
  } else {
    if (el) el.remove();
  }
}

socket.on('history', (msgs) => {
  messagesEl.innerHTML = '';
  for (const m of msgs.slice(-30)) appendMessage(m, true);
  updatePlaceholder();
});

socket.on('message', (msg) => {
  const sk = srcKey(msg.source);
  if (sk && !settings[sk]) return;
  if (isBanned(msg.username)) return;
  appendMessage(msg, false);
  while (messagesEl.children.length > MAX_VISIBLE) messagesEl.removeChild(messagesEl.firstChild);
});

function appendMessage(msg, fromHistory) {
  const div = document.createElement('div');
  div.className = 'msg';
  div._msg = msg;

  const src = msg.source === 'custom' ? 'bonebrg' : msg.source;
  const badge = document.createElement('span');
  badge.className = `badge badge-${src}`;
  badge.textContent = msg.source === 'custom' ? 'BONEBRG' : msg.source;
  badge.style.display = settings.badges ? '' : 'none';
  div.appendChild(badge);

  if (msg.replyTo) {
    const ri = document.createElement('span');
    ri.className = 'reply-indicator';
    const preview = msg.replyTo.message.length > 40 ? msg.replyTo.message.slice(0,40) + '...' : msg.replyTo.message;
    ri.innerHTML = `<span class="ru">${msg.replyTo.username}</span>: ${preview}`;
    div.appendChild(ri);
  }

  const user = document.createElement('span');
  user.className = 'user';
  user.textContent = msg.username + ':';
  if (msg.userColor && settings.userColor) {
    if (msg.userColor.gradient && msg.userColor.color2) {
      user.style.background = `linear-gradient(90deg, ${msg.userColor.color}, ${msg.userColor.color2})`;
      user.style.webkitBackgroundClip = 'text';
      user.style.webkitTextFillColor = 'transparent';
      user.style.backgroundClip = 'text';
    } else {
      user.style.color = msg.userColor.color;
    }
  } else if (msg.linked && settings.linkColor) {
    applyLinkedColor(user);
  } else {
    if (msg.source === 'twitch' && msg.color && settings.twitchColor) user.style.color = msg.color;
    else if (msg.source === 'twitch') user.style.color = settings.twitchFallback;
    if (msg.source === 'youtube') user.style.color = settings.ytColor;
  }
  div.appendChild(user);

  if (msg.linked) {
    const li = document.createElement('span');
    li.textContent = '⛓';
    li.style.cssText = 'font-size:11px;opacity:.5;margin-left:2px';
    div.appendChild(li);
  }

  const text = document.createElement('span');
  text.className = 'text';
  const cleanText = stripMeta(msg.message);
  if (msg.parsedHtml) {
    text.innerHTML = msg.parsedHtml;
  } else {
    const textNodes = renderTextWithEmotes(cleanText, msg.emotes);
    text.append(...textNodes);
  }
  div.appendChild(text);

  if (msg.font && settings.fonts) applyFontStyle(text, msg.font);

  const time = document.createElement('span');
  time.className = 'time';
  time.style.display = settings.showTime ? '' : 'none';
  time.textContent = new Date(msg.timestamp).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
  div.appendChild(time);

  if (msg.effect) {
    const et = document.createElement('span');
    et.className = 'effect-tag';
    et.textContent = msg.effect.startsWith('flag:') ? msg.effect.replace('flag:','') : msg.effect;
    et.onclick = () => {
      if (msg.effect === 'wave') applyWave(text, cleanText);
      else if (msg.effect === 'rainbow') applyRainbow(text, cleanText);
      else if (msg.effect && msg.effect.startsWith('flag:')) applyFlag(text, cleanText, msg.effect.replace('flag:', ''));
    };
    div.appendChild(et);
    if (!fromHistory && !settings.noAnim) setTimeout(() => {
      if (msg.effect === 'wave') applyWave(text, cleanText);
      else if (msg.effect === 'rainbow') applyRainbow(text, cleanText);
      else if (msg.effect && msg.effect.startsWith('flag:')) applyFlag(text, cleanText, msg.effect.replace('flag:', ''));
    }, 100);
  }

  div.style.background = settings.showBubbleBg && settings.bubbleBgMode !== 'none' ? settings.bubbleColor : 'transparent';
  div.style.borderRadius = settings.bubbleShape === 'circle' ? '50px' : settings.bubbleShape === 'square' ? '0' : '10px';
  div.style.border = settings.showBubbleBg ? '1px solid rgba(48,54,61,0.5)' : 'none';
  if (settings.showBubbleBg) div.style.boxShadow = ''; else div.style.boxShadow = 'none';
  if (settings.noAnim || !settings.showBubbleBg) div.style.animation = 'none';

  messagesEl.appendChild(div);
  if (!fromHistory) {
    setTimeout(() => div.scrollIntoView({ behavior:'smooth', block:'end' }), 50);
  }
  if (settings.msgLife > 0) {
    div._timeout = setTimeout(() => {
      div.style.animation = 'fadeOut .5s cubic-bezier(.16,1,.3,1) forwards';
      div._fading = true;
      setTimeout(() => { if (div.parentNode) div.remove(); }, 550);
    }, settings.msgLife * 1000);
  }
  updatePlaceholder();
}

// Settings panel UI
const panel = document.getElementById('settings-panel');
const toggle = document.getElementById('settings-toggle');
const closeBtn = document.getElementById('settings-close');

function showToggle() { toggle.classList.add('show'); }
function hideToggle() { toggle.classList.remove('show'); }

let toggleVisible = false;
document.addEventListener('mousemove', () => { showToggle(); toggleVisible = true; });
document.addEventListener('mouseleave', () => { if (!panel.classList.contains('show')) { hideToggle(); toggleVisible = false; } });

toggle.onclick = () => { panel.classList.add('show'); hideToggle(); };
closeBtn.onclick = () => { panel.classList.remove('show'); showToggle(); };

document.addEventListener('keydown', (e) => {
  if (e.key === ' ' && !panel.classList.contains('show')) {
    e.preventDefault();
    if (toggleVisible) { hideToggle(); toggleVisible = false; }
    else { showToggle(); toggleVisible = true; }
  }
  if (e.key === 'Escape' && panel.classList.contains('show')) panel.classList.remove('show');
});

// Wire up settings controls
const settingMap = {
  's-bg': 'bg', 's-obs': 'obsTransparent', 's-badges': 'badges', 's-fonts': 'fonts', 's-user-bg': 'userBg', 's-text-size': 'textSize',
  's-bubble-bg-mode': 'bubbleBgMode', 's-bubble-bg': 'showBubbleBg',
  's-twitch-color': 'twitchColor', 's-user-color': 'userColor', 's-twitch-fallback': 'twitchFallback', 's-yt-color': 'ytColor',
  's-link-color': 'linkColor', 's-link-color2': 'linkColor2', 's-link-gradient': 'linkGradient',
  's-no-anim': 'noAnim', 's-time': 'showTime',
  's-msg-life': 'msgLife',
  's-bubble-color': 'bubbleColor', 's-bubble-shape': 'bubbleShape',
  's-src-twitch': 'srcTwitch', 's-src-youtube': 'srcYoutube',
  's-src-discord': 'srcDiscord', 's-src-custom': 'srcCustom',
  's-banlist': 'banlist',
};

Object.entries(settingMap).forEach(([id, key]) => {
  const el = document.getElementById(id);
  if (!el) return;
  if (el.type === 'checkbox') el.checked = settings[key];
  else el.value = settings[key];
  el.onchange = el.oninput = () => {
    settings[key] = el.type === 'checkbox' ? el.checked : el.value;
    saveSettings();
    applySettings();
  };
});
document.getElementById('s-twitch-color').onchange = function() {
  document.getElementById('s-twitch-fallback-row').style.display = this.checked ? 'none' : '';
};
document.getElementById('s-link-gradient').onchange = function() {
  document.getElementById('s-link-color2-row').style.display = this.checked ? '' : 'none';
};
document.getElementById('s-text-size').oninput = function() {
  document.getElementById('s-text-size-val').textContent = this.value;
};
document.getElementById('s-msg-life').onchange = function() {
  document.querySelectorAll('.msg').forEach(el => {
    if (el._timeout) clearTimeout(el._timeout);
    if (el._fading) return;
    if (+this.value > 0) {
      el._timeout = setTimeout(() => {
        el.style.animation = 'fadeOut .5s cubic-bezier(.16,1,.3,1) forwards';
        el._fading = true;
        setTimeout(() => { if (el.parentNode) el.remove(); updatePlaceholder(); }, 550);
      }, +this.value * 1000);
    }
  });
};

document.getElementById('s-reset').onclick = () => {
  settings = {...DEFAULT_SETTINGS};
  saveSettings();
  Object.entries(settingMap).forEach(([id, key]) => {
    const el = document.getElementById(id);
    if (!el) return;
    if (el.type === 'checkbox') el.checked = settings[key];
    else el.value = settings[key];
  });
  document.getElementById('s-text-size-val').textContent = DEFAULT_SETTINGS.textSize;
  document.getElementById('s-twitch-fallback-row').style.display = DEFAULT_SETTINGS.twitchColor ? 'none' : '';
  document.getElementById('s-link-color2-row').style.display = DEFAULT_SETTINGS.linkGradient ? '' : '';
  applySettings();
  document.querySelectorAll('.msg').forEach(el => {
    if (el._timeout) clearTimeout(el._timeout);
    if (el._fading) return;
    if (settings.msgLife > 0) {
      el._timeout = setTimeout(() => {
        el.style.animation = 'fadeOut .5s cubic-bezier(.16,1,.3,1) forwards';
        el._fading = true;
        setTimeout(() => { if (el.parentNode) el.remove(); updatePlaceholder(); }, 550);
      }, settings.msgLife * 1000);
    }
  });
};

document.getElementById('s-text-size-val').textContent = settings.textSize;
document.getElementById('s-twitch-fallback-row').style.display = settings.twitchColor ? 'none' : '';
document.getElementById('s-link-color2-row').style.display = settings.linkGradient ? '' : 'none';
applySettings();
updatePlaceholder();
</script>
