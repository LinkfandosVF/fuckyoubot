<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Silkscreen&display=swap" rel="stylesheet">
<style>
@keyframes slideIn{0%{opacity:0;transform:translateY(20px) scale(.97)}100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes glow{0%,100%{box-shadow:0 0 4px rgba(88,166,255,.3)}50%{box-shadow:0 0 12px rgba(88,166,255,.6)}}
@keyframes badgePop{0%{transform:scale(0)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes flagAnim{0%{background-position:0% 50%}100%{background-position:100% 50%}}
.flag-text{background-size:200% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:flagAnim 3s linear infinite}
*{margin:0;padding:0;box-sizing:border-box}
body{background:transparent;font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif;overflow:hidden;height:100vh}
#messages{display:flex;flex-direction:column;gap:6px;padding:16px;height:100vh;overflow:hidden;justify-content:flex-end}
.msg{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;background:rgba(13,17,23,0.75);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(48,54,61,0.5);animation:slideIn .4s cubic-bezier(.16,1,.3,1) forwards,glow 3s ease-in-out .4s infinite}
.msg .badge{font-size:9px;font-weight:700;padding:2px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.5px;animation:badgePop .3s cubic-bezier(.34,1.56,.64,1) .1s both;flex-shrink:0}
.badge-twitch{background:linear-gradient(135deg,#9147ff,#772ce8);color:#fff;box-shadow:0 0 8px rgba(145,71,255,.4)}
.badge-youtube{background:linear-gradient(135deg,#ff0033,#cc0000);color:#fff;box-shadow:0 0 8px rgba(255,0,51,.4)}
.badge-discord{background:linear-gradient(135deg,#5865f2,#4752c4);color:#fff;box-shadow:0 0 8px rgba(88,101,242,.4)}
.badge-custom,.badge-bonebrg{background:#fff;color:#000;box-shadow:none}
.msg .user{font-weight:700;font-size:14px;flex-shrink:0}
.msg .text{font-size:14px;color:#e6edf3;word-break:break-word;flex:1;line-height:1.4}
.msg .reply-indicator{font-size:12px;color:#8b949e;display:flex;align-items:center;gap:4px;flex-shrink:0}
.msg .reply-indicator::before{content:'↩'}
.msg .reply-indicator .ru{color:#58a6ff;font-weight:600}
.msg .time{font-size:11px;color:#484f58;flex-shrink:0}
.msg .effect-tag{font-size:10px;color:#8b949e;margin-left:4px;cursor:pointer;border-bottom:1px dotted #555}
@media(prefers-reduced-motion:reduce){.msg{animation:none}.msg .badge{animation:none}.flag-text{animation:none}}
</style>
</head>
<body>
<div id="messages"></div>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const messagesEl = document.getElementById('messages');
const MAX_VISIBLE = 30;
const EFFECT_DURATION = 5000;
const FADE_DURATION = 1000;
const flags = {
  pride: ['#ff0000','#ff8c00','#ffff00','#008000','#0000ff','#4b0082','#8b00ff'],
  trans: ['#55cdfc','#f7a8b8','#fff','#f7a8b8','#55cdfc'],
  bi: ['#d60270','#d60270','#9b4f96','#0038a8','#0038a8'],
  pan: ['#ff218c','#ffd800','#21b1ff'],
  nb: ['#fcf434','#fff','#9c59d1','#2c2c2c'],
  lesbian: ['#d52d00','#ef7627','#ff9a56','#fff','#d162a4','#b55690','#a30262'],
  ace: ['#000','#a4a4a4','#fff','#810081'],
  aro: ['#3da542','#a7d379','#fff','#a7d379','#3da542'],
  mlm: ['#078585','#98e8e8','#fff','#98e8e8','#078585'],
  genderfluid: ['#ff76a4','#fff','#bf11d','#000','#303cbe'],
  agender: ['#000','#bababa','#fff','#baf484','#fff','#bababa','#000']
};

function stripMeta(text) {
  const s = text.indexOf('\u200D'); if(s===-1)return text;
  const e = text.lastIndexOf('\u200D'); if(e===-1||e<=s)return text;
  return text.slice(0,s)+text.slice(e+1);
}

function applyFontStyle(el, f) {
  const ol = f.ol > 0 ? `${f.ol}px solid ${f.olc}` : 'none';
  const hasShadow = f.shx || f.shy || f.shb;
  const sh = hasShadow ? `${f.shx||0}px ${f.shy||0}px ${f.shb||0}px ${f.shc}${f.sho < 100 ? Math.round(f.sho*2.55).toString(16).padStart(2,'0') : ''}` : 'none';
  el.style.cssText = `font-family:${f.fn};color:${f.fc||'#e6edf3'};-webkit-text-stroke:${ol};text-shadow:${sh}`;
  el.style.background = f.bg || 'transparent';
}

function stopEffect(el) {
  if (el._effectTimer) { cancelAnimationFrame(el._effectTimer); el._effectTimer = null; }
}

function applyWave(el, text) {
  stopEffect(el);
  el.innerHTML = '';
  const spans = [];
  for (let i = 0; i < text.length; i++) {
    const sp = document.createElement('span');
    sp.textContent = text[i] === ' ' ? '\u00A0' : text[i];
    sp.style.display = 'inline-block';
    el.appendChild(sp);
    spans.push(sp);
  }
  const startTime = performance.now();
  function frame(t) {
    const elapsed = t - startTime;
    const remaining = Math.max(0, EFFECT_DURATION - elapsed);
    const amp = 5 * Math.min(remaining / FADE_DURATION, 1);
    for (let i = 0; i < spans.length; i++) {
      const phase = (elapsed / 1000 + i * 0.08) / 0.4 * Math.PI * 2;
      spans[i].style.transform = `translateY(${Math.sin(phase) * amp}px)`;
    }
    if (elapsed < EFFECT_DURATION) {
      el._effectTimer = requestAnimationFrame(frame);
    } else {
      el.innerHTML = text;
    }
  }
  el._effectTimer = requestAnimationFrame(frame);
}

function applyRainbow(el, text) {
  stopEffect(el);
  el.innerHTML = '';
  const spans = [];
  for (let i = 0; i < text.length; i++) {
    const sp = document.createElement('span');
    sp.textContent = text[i] === ' ' ? '\u00A0' : text[i];
    el.appendChild(sp);
    spans.push(sp);
  }
  const startTime = performance.now();
  function frame(t) {
    const elapsed = t - startTime;
    const remaining = Math.max(0, EFFECT_DURATION - elapsed);
    const fade = Math.min(remaining / FADE_DURATION, 1);
    const sat = 100 * fade + '%';
    const light = 35 + 20 * fade;
    for (let i = 0; i < spans.length; i++) {
      const hue = ((i / spans.length) * 360 + elapsed / 1000 * 120) % 360;
      spans[i].style.color = `hsl(${hue}, ${sat}, ${light}%)`;
    }
    if (elapsed < EFFECT_DURATION) {
      el._effectTimer = requestAnimationFrame(frame);
    } else {
      el.innerHTML = text;
    }
  }
  el._effectTimer = requestAnimationFrame(frame);
}

function applyFlag(el, text, fname) {
  stopEffect(el);
  const cols = flags[fname] || flags.pride;
  el.innerHTML = '';
  const spans = [];
  for (let i = 0; i < text.length; i++) {
    const sp = document.createElement('span');
    sp.textContent = text[i] === ' ' ? '\u00A0' : text[i];
    el.appendChild(sp);
    spans.push(sp);
  }
  const startTime = performance.now();
  function frame(t) {
    const elapsed = t - startTime;
    const remaining = Math.max(0, EFFECT_DURATION - elapsed);
    const fade = Math.min(remaining / FADE_DURATION, 1);
    const offset = Math.floor(elapsed / 300) % cols.length;
    for (let i = 0; i < spans.length; i++) {
      const ci = (i + offset) % cols.length;
      spans[i].style.color = cols[ci];
      spans[i].style.opacity = fade;
    }
    if (elapsed < EFFECT_DURATION) {
      el._effectTimer = requestAnimationFrame(frame);
    } else {
      el.innerHTML = text;
    }
  }
  el._effectTimer = requestAnimationFrame(frame);
}

socket.on('history', (msgs) => {
  messagesEl.innerHTML = '';
  for (const m of msgs.slice(-30)) appendMessage(m, true);
});

socket.on('message', (msg) => {
  appendMessage(msg, false);
  while (messagesEl.children.length > MAX_VISIBLE) messagesEl.removeChild(messagesEl.firstChild);
});

function appendMessage(msg, fromHistory) {
  const div = document.createElement('div');
  div.className = 'msg';

  const src = msg.source === 'custom' ? 'bonebrg' : msg.source;
  const badge = document.createElement('span');
  badge.className = `badge badge-${src}`;
  badge.textContent = msg.source === 'custom' ? 'BONEBRG' : msg.source;
  div.appendChild(badge);

  if (msg.replyTo) {
    const ri = document.createElement('span');
    ri.className = 'reply-indicator';
    const preview = msg.replyTo.message.length > 40 ? msg.replyTo.message.slice(0,40) + '...' : msg.replyTo.message;
    ri.innerHTML = `<span class="ru">${msg.replyTo.username}</span>: ${preview}`;
    div.appendChild(ri);
  }

  const user = document.createElement('span');
  user.className = 'user';
  user.textContent = msg.username + ':';
  if (msg.source === 'twitch' && msg.color) user.style.color = msg.color;
  div.appendChild(user);

  if (msg.linked) {
    const li = document.createElement('span');
    li.textContent = '⛓';
    li.style.cssText = 'font-size:11px;opacity:.5;margin-left:2px';
    div.appendChild(li);
  }

  const text = document.createElement('span');
  text.className = 'text';
  const cleanText = stripMeta(msg.message);
  text.textContent = cleanText;
  div.appendChild(text);

  if (msg.font) applyFontStyle(text, msg.font);

  const time = document.createElement('span');
  time.className = 'time';
  time.textContent = new Date(msg.timestamp).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
  div.appendChild(time);

  if (msg.effect) {
    const et = document.createElement('span');
    et.className = 'effect-tag';
    et.textContent = msg.effect.startsWith('flag:') ? msg.effect.replace('flag:','') : msg.effect;
    et.onclick = () => {
      if (msg.effect === 'wave') applyWave(text, cleanText);
      else if (msg.effect === 'rainbow') applyRainbow(text, cleanText);
      else if (msg.effect && msg.effect.startsWith('flag:')) applyFlag(text, cleanText, msg.effect.replace('flag:', ''));
    };
    div.appendChild(et);
    if (!fromHistory) setTimeout(() => {
      if (msg.effect === 'wave') applyWave(text, cleanText);
      else if (msg.effect === 'rainbow') applyRainbow(text, cleanText);
      else if (msg.effect && msg.effect.startsWith('flag:')) applyFlag(text, cleanText, msg.effect.replace('flag:', ''));
    }, 100);
  }

  messagesEl.appendChild(div);
  if (!fromHistory) setTimeout(() => div.scrollIntoView({ behavior:'smooth', block:'end' }), 50);
}
</script>
</body>
</html>
