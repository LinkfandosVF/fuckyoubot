<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live</title>
<style>
@keyframes slideIn {
  0% { opacity: 0; transform: translateY(20px) scale(0.97); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes glow {
  0%, 100% { box-shadow: 0 0 4px rgba(88,166,255,0.3); }
  50% { box-shadow: 0 0 12px rgba(88,166,255,0.6); }
}
@keyframes badgePop {
  0% { transform: scale(0); }
  60% { transform: scale(1.15); }
  100% { transform: scale(1); }
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: transparent; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif; overflow: hidden; height: 100vh; }
#messages { display: flex; flex-direction: column; gap: 6px; padding: 16px; height: 100vh; overflow: hidden; justify-content: flex-end; }
.msg { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 10px; background: rgba(13,17,23,0.75); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border: 1px solid rgba(48,54,61,0.5); animation: slideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards, glow 3s ease-in-out 0.4s infinite; }
.msg .badge { font-size: 9px; font-weight: 700; padding: 2px 8px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.5px; animation: badgePop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) 0.1s both; flex-shrink: 0; }
.badge-twitch { background: linear-gradient(135deg, #9147ff, #772ce8); color: #fff; box-shadow: 0 0 8px rgba(145,71,255,0.4); }
.badge-youtube { background: linear-gradient(135deg, #ff0033, #cc0000); color: #fff; box-shadow: 0 0 8px rgba(255,0,51,0.4); }
.badge-discord { background: linear-gradient(135deg, #5865f2, #4752c4); color: #fff; box-shadow: 0 0 8px rgba(88,101,242,0.4); }
.badge-custom { background: linear-gradient(135deg, #238636, #1a6b2e); color: #fff; box-shadow: 0 0 8px rgba(35,134,54,0.4); }
.msg .user { font-weight: 700; font-size: 14px; flex-shrink: 0; }
.msg .user-twitch { color: #b877ff; }
.msg .user-youtube { color: #ff4466; }
.msg .user-discord { color: #7984f5; }
.msg .user-custom { color: #3fb950; }
.msg .text { font-size: 14px; color: #e6edf3; word-break: break-word; flex: 1; line-height: 1.4; }
.msg .reply-indicator { font-size: 12px; color: #8b949e; display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
.msg .reply-indicator::before { content: '↩'; }
.msg .reply-indicator .ru { color: #58a6ff; font-weight: 600; }
.msg .time { font-size: 11px; color: #484f58; flex-shrink: 0; }
@media (prefers-reduced-motion: reduce) {
  .msg { animation: none; }
  .msg .badge { animation: none; }
}
</style>
</head>
<body>
<div id="messages"></div>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const messagesEl = document.getElementById('messages');
const MAX_VISIBLE = 30;

function stripMeta(text) {
  const start = text.indexOf('\u200D');
  if (start === -1) return text;
  const end = text.lastIndexOf('\u200D');
  if (end === -1 || end <= start) return text;
  return text.slice(0, start) + text.slice(end + 1);
}

socket.on('history', (msgs) => {
  messagesEl.innerHTML = '';
  const recent = msgs.slice(-MAX_VISIBLE);
  for (const m of recent) appendMessage(m, true);
});

socket.on('message', (msg) => {
  appendMessage(msg, false);
  while (messagesEl.children.length > MAX_VISIBLE) {
    messagesEl.removeChild(messagesEl.firstChild);
  }
});

function appendMessage(msg, fromHistory) {
  const div = document.createElement('div');
  div.className = 'msg';

  const badge = document.createElement('span');
  badge.className = `badge badge-${msg.source}`;
  badge.textContent = msg.source;
  div.appendChild(badge);

  if (msg.replyTo) {
    const ri = document.createElement('span');
    ri.className = 'reply-indicator';
    ri.innerHTML = `<span class="ru">${msg.replyTo.username}</span>`;
    div.appendChild(ri);
  }

  const user = document.createElement('span');
  user.className = `user user-${msg.source}`;
  user.textContent = msg.username + ':';
  div.appendChild(user);

  const text = document.createElement('span');
  text.className = 'text';
  text.textContent = stripMeta(msg.message);
  div.appendChild(text);

  const time = document.createElement('span');
  time.className = 'time';
  const d = new Date(msg.timestamp);
  time.textContent = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  div.appendChild(time);

  messagesEl.appendChild(div);
  if (!fromHistory) {
    setTimeout(() => div.scrollIntoView({ behavior: 'smooth', block: 'end' }), 50);
  }
}
</script>
</body>
</html>
