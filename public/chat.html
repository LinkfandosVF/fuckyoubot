<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#fff;color:#000;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;display:flex;flex-direction:column;height:100vh}
@keyframes wave{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes flagAnim{0%{background-position:0% 50%}100%{background-position:100% 50%}}
.wave-text span{display:inline-block;animation:wave .4s ease-in-out infinite}
.flag-text{background-size:200% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:flagAnim 3s linear infinite}
#header{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;border-bottom:1px solid #e0e0e0;background:#fff;position:relative;z-index:10}
#header h1{font-size:16px;font-weight:700;color:#000}
#menu-right{display:flex;align-items:center;gap:8px}
#settings-btn{background:none;border:1px solid #ccc;border-radius:6px;padding:4px 8px;cursor:pointer;font-size:14px;color:#555}
#settings-btn:hover{background:#f0f0f0}
#nick-display{font-size:13px;color:#666}
.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.status-dot.connected{background:#3fb950}
.status-dot.disconnected{background:#f85149}
#messages{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px;background:#fff}
.msg{display:flex;flex-direction:column;gap:2px;padding:0;max-width:85%}
.msg.own{align-items:flex-start}
.msg .bubble{background:#f0f0f0;border-radius:12px;padding:8px 12px;font-size:14px;line-height:1.4;word-break:break-word;position:relative;transition:background .15s}
.msg.own .bubble{background:#e8f0fe;border-bottom-left-radius:4px}
.msg .bubble:hover{background:#e4e4e4}
.msg.own .bubble:hover{background:#d8e8fc}
.msg .badge{font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;text-transform:uppercase;letter-spacing:.3px;display:inline-block;width:fit-content}
.badge-twitch{background:#9147ff;color:#fff}
.badge-youtube{background:#ff0033;color:#fff}
.badge-discord{background:#5865f2;color:#fff}
.badge-bonebrg{background:#000;color:#fff}
.msg .user{font-size:12px;font-weight:600;margin-bottom:2px;display:flex;align-items:center;gap:4px}
.msg .user .un{font-weight:700}
.msg .time{font-size:10px;color:#999;margin-top:2px}
.msg .reply-indicator{font-size:11px;color:#666;cursor:pointer;margin-bottom:2px}
.msg .reply-indicator:hover{color:#000}
.msg .effect-tag{font-size:10px;color:#888;margin-left:4px;cursor:pointer;border-bottom:1px dotted #ccc}
.msg .effect-tag:hover{color:#000}
#reply-bar{display:none;align-items:center;gap:8px;padding:6px 16px;background:#f8f9fa;border-top:1px solid #e0e0e0;font-size:13px;color:#666}
#reply-bar.show{display:flex}
#reply-bar .reply-to{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#reply-bar .reply-to strong{color:#000}
#reply-bar #cancel-reply{background:none;border:none;color:#999;cursor:pointer;font-size:18px;padding:0 4px}
#reply-bar #cancel-reply:hover{color:#f00}
#input-area{display:flex;align-items:center;gap:6px;padding:8px 16px;border-top:1px solid #e0e0e0;background:#fff;position:relative}
#source-select{background:#fff;color:#000;border:1px solid #ccc;border-radius:6px;padding:6px 8px;font-size:13px;cursor:pointer;outline:none}
#msg-input{flex:1;background:#f8f9fa;border:1px solid #ccc;border-radius:6px;padding:8px 12px;color:#000;font-size:14px;outline:none}
#msg-input:focus{border-color:#000}
#send-btn{background:#000;color:#fff;border:none;border-radius:6px;padding:8px 16px;font-size:14px;font-weight:600;cursor:pointer}
#send-btn:hover{background:#333}
#autocomplete{display:none;position:absolute;bottom:100%;left:16px;background:#fff;border:1px solid #e0e0e0;border-radius:8px;overflow:hidden;min-width:220px;max-height:200px;overflow-y:auto;box-shadow:0 4px 12px rgba(0,0,0,.1)}
#autocomplete.show{display:block}
#autocomplete .item{padding:8px 12px;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:8px}
#autocomplete .item:hover,#autocomplete .item.active{background:#f0f0f0}
#autocomplete .item img{width:24px;height:24px;border-radius:4px}
#settings-panel{display:none;position:absolute;top:44px;right:16px;background:#fff;border:1px solid #e0e0e0;border-radius:8px;padding:16px;width:300px;box-shadow:0 4px 16px rgba(0,0,0,.12);z-index:100}
#settings-panel.show{display:block}
#settings-panel h3{font-size:14px;margin-bottom:12px}
#settings-panel label{font-size:12px;color:#666;display:block;margin-top:8px;margin-bottom:4px}
#settings-panel select,#settings-panel input[type=color]{width:100%;padding:6px;border:1px solid #ccc;border-radius:4px;font-size:13px}
#settings-panel select{background:#fff}
.font-preview{margin-top:12px;padding:12px;border:1px solid #e0e0e0;border-radius:8px;text-align:center;font-size:18px}
#emote-grid{display:none;position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:#fff;border:1px solid #e0e0e0;border-radius:8px;padding:8px;width:320px;max-height:200px;overflow-y:auto;box-shadow:0 4px 12px rgba(0,0,0,.1);flex-wrap:wrap;gap:4px;z-index:50}
#emote-grid.show{display:flex}
#emote-grid .emote-item{width:40px;height:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:4px}
#emote-grid .emote-item:hover{background:#f0f0f0}
#emote-grid .emote-item img{max-width:32px;max-height:32px}
</style>
</head>
<body>
<div id="header">
  <h1>Chat</h1>
  <div id="menu-right">
    <button id="settings-btn">Aa</button>
    <div id="nick-display"><span class="status-dot connected" id="status-dot"></span><span id="current-nick">User</span></div>
  </div>
</div>
<div id="settings-panel">
  <h3>Font Settings</h3>
  <label>Font</label>
  <select id="font-family">
    <option value="Arial">Arial</option>
    <option value="Georgia">Georgia</option>
    <option value="Times New Roman">Times New Roman</option>
    <option value="Courier New">Courier New</option>
    <option value="Verdana">Verdana</option>
    <option value="Trebuchet MS">Trebuchet MS</option>
    <option value="Comic Sans MS">Comic Sans MS</option>
    <option value="Impact">Impact</option>
    <option value="Palatino">Palatino</option>
    <option value="Garamond">Garamond</option>
    <option value="Bookman">Bookman</option>
    <option value="Tahoma">Tahoma</option>
    <option value="Lucida Console">Lucida Console</option>
    <option value="Monaco">Monaco</option>
    <option value="Brush Script MT">Brush Script MT</option>
  </select>
  <label>Text Color</label>
  <input type="color" id="font-color" value="#000000">
  <label>Background</label>
  <input type="color" id="font-bg" value="#f0f0f0">
  <label>Outline</label>
  <select id="font-outline">
    <option value="none">None</option>
    <option value="1px solid #000">Thin Black</option>
    <option value="2px solid #000">Thick Black</option>
    <option value="1px solid #fff">Thin White</option>
    <option value="2px solid #fff">Thick White</option>
  </select>
  <label>Shadow</label>
  <select id="font-shadow">
    <option value="none">None</option>
    <option value="1px 1px 2px rgba(0,0,0,0.3)">Soft</option>
    <option value="2px 2px 4px rgba(0,0,0,0.4)">Medium</option>
    <option value="3px 3px 6px rgba(0,0,0,0.5)">Strong</option>
    <option value="1px 1px 2px rgba(255,255,255,0.5)">Soft Light</option>
  </select>
  <div class="font-preview" id="font-preview">AaBbYy</div>
</div>
<div id="messages"></div>
<div id="reply-bar">
  <span class="reply-to">Replying to <strong id="reply-user"></strong>: <span id="reply-text"></span></span>
  <button id="cancel-reply">&times;</button>
</div>
<div id="emote-grid"></div>
<div id="input-area">
  <select id="source-select">
    <option value="custom">BONEBRG</option>
    <option value="discord">Discord</option>
  </select>
  <input id="msg-input" type="text" placeholder="Type a message..." autocomplete="off">
  <button id="send-btn">Send</button>
  <div id="autocomplete"></div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
let username = localStorage.getItem('nick') || 'User';
let currentReply = null;
const commands = [
  { cmd: '/nick', desc: 'Change username', args: '<name>' },
  { cmd: '/wave', desc: 'Wavy text 5s', args: '<message>' },
  { cmd: '/rainbow', desc: 'Rainbow text 5s', args: '<message>' },
  { cmd: '/flag', desc: 'Pride flag gradient', args: '<flag> <message>' }
];
const flags = {
  pride: ['#ff0000','#ff8c00','#ffff00','#008000','#0000ff','#4b0082','#8b00ff'],
  trans: ['#55cdfc','#f7a8b8','#fff','#f7a8b8','#55cdfc'],
  bi: ['#d60270','#d60270','#9b4f96','#0038a8','#0038a8'],
  pan: ['#ff218c','#ffd800','#21b1ff'],
  nb: ['#fcf434','#fff','#9c59d1','#2c2c2c'],
  lesbian: ['#d52d00','#ef7627','#ff9a56','#fff','#d162a4','#b55690','#a30262'],
  ace: ['#000','#a4a4a4','#fff','#810081'],
  aro: ['#3da542','#a7d379','#fff','#a7d379','#3da542'],
  mlm: ['#078585','#98e8e8','#fff','#98e8e8','#078585'],
  genderfluid: ['#ff76a4','#fff','#bf11d','#000','#303cbe'],
  agender: ['#000','#bababa','#fff','#baf484','#fff','#bababa','#000']
};
let filteredCommands = [], selectedCmdIdx = -1;
let emotes = [];
let fontSettings = JSON.parse(localStorage.getItem('font') || '{"fn":"Arial","fc":"#000000","bg":"#f0f0f0","ol":"none","sh":"none"}');

const messagesEl = document.getElementById('messages');
const input = document.getElementById('msg-input');
const sendBtn = document.getElementById('send-btn');
const replyBar = document.getElementById('reply-bar');
const replyUser = document.getElementById('reply-user');
const replyText = document.getElementById('reply-text');
const cancelReply = document.getElementById('cancel-reply');
const autocomplete = document.getElementById('autocomplete');
const nickDisplay = document.getElementById('current-nick');
const sourceSelect = document.getElementById('source-select');
const statusDot = document.getElementById('status-dot');
const settingsBtn = document.getElementById('settings-btn');
const settingsPanel = document.getElementById('settings-panel');
const emoteGrid = document.getElementById('emote-grid');
const fontPreview = document.getElementById('font-preview');

nickDisplay.textContent = username;
settingsBtn.onclick = () => settingsPanel.classList.toggle('show');

['font-family','font-color','font-bg','font-outline','font-shadow'].forEach(id => {
  const el = document.getElementById(id);
  const key = { 'font-family':'fn','font-color':'fc','font-bg':'bg','font-outline':'ol','font-shadow':'sh' }[id];
  el.value = fontSettings[key] || el.value;
  el.onchange = () => {
    fontSettings[key] = el.value;
    localStorage.setItem('font', JSON.stringify(fontSettings));
    updateFontPreview();
  };
});
function updateFontPreview() {
  fontPreview.style.cssText = `font-family:${fontSettings.fn};color:${fontSettings.fc};background:${fontSettings.bg};-webkit-text-stroke:${fontSettings.ol};text-shadow:${fontSettings.sh}`;
}
updateFontPreview();

fetch('https://api.frankerfacez.com/v1/set/global').then(r=>r.json()).then(d=>{
  for (const set of Object.values(d.sets || {}))
    for (const em of set.emoticons || []) emotes.push({name:em.name,url:`https:${em.urls['1']||em.urls['2']||em.urls['4']||''}`});
}).catch(()=>{});

socket.on('connect', () => statusDot.className = 'status-dot connected');
socket.on('disconnect', () => statusDot.className = 'status-dot disconnected');
socket.on('nickChanged', (nick) => { username = nick; nickDisplay.textContent = nick; localStorage.setItem('nick', nick); });

socket.on('history', (msgs) => {
  messagesEl.innerHTML = '';
  for (const m of msgs.slice(-30)) appendMessage(m, false);
  scrollToBottom();
});

socket.on('message', (msg) => { appendMessage(msg, true); });

function appendMessage(msg, scroll) {
  const div = document.createElement('div');
  div.className = 'msg own';
  div.dataset.id = msg.id;
  if (msg.color) div.style.setProperty('--twitch-color', msg.color);

  const userRow = document.createElement('div');
  userRow.className = 'user';
  const badge = document.createElement('span');
  const src = msg.source === 'custom' ? 'bonebrg' : msg.source;
  badge.className = `badge badge-${src}`;
  badge.textContent = msg.source === 'custom' ? 'BONEBRG' : msg.source;
  userRow.appendChild(badge);

  if (msg.replyTo) {
    const rp = document.createElement('span');
    rp.className = 'reply-indicator';
    rp.textContent = `↩ ${msg.replyTo.username}`;
    rp.title = msg.replyTo.message;
    userRow.appendChild(rp);
  }

  const un = document.createElement('span');
  un.className = 'un';
  un.textContent = msg.username;
  if (msg.source === 'twitch' && msg.color) un.style.color = msg.color;
  userRow.appendChild(un);

  const tm = document.createElement('span');
  tm.className = 'time';
  const d = new Date(msg.timestamp);
  tm.textContent = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  userRow.appendChild(tm);
  div.appendChild(userRow);

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  if (fontSettings) {
    if (msg.font) bubble.style.cssText = `font-family:${msg.font.fn||'inherit'};color:${msg.font.fc||'inherit'};background:${msg.font.bg||'#f0f0f0'};-webkit-text-stroke:${msg.font.ol||'none'};text-shadow:${msg.font.sh||'none'}`;
  }

  if (msg.effect) {
    if (msg.effect === 'wave') {
      bubble.classList.add('wave-text');
      bubble.dataset.effect = 'wave';
      for (const ch of msg.message) {
        const sp = document.createElement('span');
        sp.textContent = ch === ' ' ? '\u00A0' : ch;
        sp.style.animationDelay = Math.random() * .5 + 's';
        bubble.appendChild(sp);
      }
    } else if (msg.effect === 'rainbow') {
      bubble.dataset.effect = 'rainbow';
      applyRainbow(bubble, msg.message);
    } else if (msg.effect.startsWith('flag:')) {
      const fname = msg.effect.replace('flag:', '');
      const cols = flags[fname] || flags.pride;
      bubble.dataset.effect = msg.effect;
      const sp = document.createElement('span');
      sp.className = 'flag-text';
      sp.style.background = `linear-gradient(90deg, ${cols.join(', ')})`;
      sp.textContent = msg.message;
      bubble.appendChild(sp);
    } else {
      bubble.textContent = msg.message;
    }
    const tag = document.createElement('span');
    tag.className = 'effect-tag';
    tag.textContent = msg.effect.startsWith('flag:') ? msg.effect.replace('flag:','') : msg.effect;
    tag.onclick = () => replayEffect(bubble, msg.effect);
    bubble.appendChild(tag);
  } else {
    bubble.textContent = msg.message;
  }

  if (msg.effect) {
    setTimeout(() => {
      if (msg.effect === 'rainbow' && bubble._rainbowTimer) clearInterval(bubble._rainbowTimer);
      bubble.classList.remove('wave-text','flag-text');
      bubble.innerHTML = '';
      const txt = document.createTextNode(msg.message);
      bubble.appendChild(txt);
      const tag = document.createElement('span'); tag.className = 'effect-tag';
      tag.textContent = msg.effect.startsWith('flag:') ? msg.effect.replace('flag:','') : msg.effect;
      tag.onclick = () => replayEffect(bubble, msg.effect);
      bubble.appendChild(tag);
    }, 5000);
  }

  const rb = document.createElement('span');
  rb.style.cssText = 'font-size:11px;color:#999;cursor:pointer;margin-top:2px';
  rb.textContent = '↩ reply';
  rb.onclick = () => setReply(msg);

  div.appendChild(bubble);
  div.appendChild(rb);
  messagesEl.appendChild(div);
  if (scroll) scrollToBottom();
}

function replayEffect(el, effect) {
  if (effect === 'wave') {
    el.classList.add('wave-text');
    el.innerHTML = '';
    for (const ch of (el.textContent || '')) {
      const sp = document.createElement('span');
      sp.textContent = ch === ' ' ? '\u00A0' : ch;
      sp.style.animationDelay = Math.random() * .5 + 's';
      el.appendChild(sp);
    }
    setTimeout(() => { el.classList.remove('wave-text'); el.textContent = el.textContent || ''; }, 5000);
  } else if (effect === 'rainbow') {
    if (el._rainbowTimer) clearInterval(el._rainbowTimer);
    applyRainbow(el, el.textContent.replace(/\[.*?\]/g,'').trim());
    setTimeout(() => { if (el._rainbowTimer) clearInterval(el._rainbowTimer); el.innerHTML = el.textContent; }, 5000);
  } else if (effect && effect.startsWith('flag:')) {
    const fname = effect.replace('flag:', '');
    const cols = flags[fname] || flags.pride;
    el.classList.add('flag-text');
    el.style.background = `linear-gradient(90deg, ${cols.join(', ')})`;
    setTimeout(() => { el.classList.remove('flag-text'); el.style.background = ''; }, 5000);
  }
}

const RAINBOW_COLORS = ['#ff0000','#ff8800','#ffff00','#00ff00','#0088ff','#0000ff','#8800ff'];
function applyRainbow(el, text) {
  el.innerHTML = '';
  const spans = [];
  for (const ch of text) {
    const sp = document.createElement('span');
    sp.textContent = ch === ' ' ? '\u00A0' : ch;
    sp.style.transition = 'color .3s ease';
    el.appendChild(sp);
    spans.push(sp);
  }
  let offset = 0;
  el._rainbowTimer = setInterval(() => {
    for (let i = 0; i < spans.length; i++)
      spans[i].style.color = RAINBOW_COLORS[(i + offset) % RAINBOW_COLORS.length];
    offset = (offset + 1) % RAINBOW_COLORS.length;
  }, 200);
  applyRainbow._spans = spans;
}

function scrollToBottom() { messagesEl.scrollTop = messagesEl.scrollHeight; }

function setReply(msg) {
  currentReply = msg;
  replyUser.textContent = msg.username;
  replyText.textContent = msg.message.length > 80 ? msg.message.slice(0,80) + '...' : msg.message;
  replyBar.classList.add('show');
  input.focus();
}

cancelReply.onclick = () => { currentReply = null; replyBar.classList.remove('show'); };

function sendMessage() {
  let text = input.value.trim();
  if (!text) return;

  if (text.startsWith('/')) {
    const parts = text.split(' ');
    const cmd = parts[0].toLowerCase();
    if (cmd === '/nick') {
      if (parts[1]) {
        username = parts[1];
        nickDisplay.textContent = username;
        localStorage.setItem('nick', username);
        socket.emit('command', { command: 'nick', args: username });
        addSystemMsg(`Nick changed to ${username}`);
      } else addSystemMsg('Usage: /nick <username>');
      input.value = ''; hideAutocomplete(); return;
    }
    if (cmd === '/wave' && parts.length > 1) {
      const msg = parts.slice(1).join(' ');
      socket.emit('sendMessage', { username, message: msg, source: sourceSelect.value, effect: 'wave', font: fontSettings });
      input.value = ''; currentReply = null; replyBar.classList.remove('show'); hideAutocomplete(); return;
    }
    if (cmd === '/rainbow' && parts.length > 1) {
      const msg = parts.slice(1).join(' ');
      socket.emit('sendMessage', { username, message: msg, source: sourceSelect.value, effect: 'rainbow', font: fontSettings });
      input.value = ''; currentReply = null; replyBar.classList.remove('show'); hideAutocomplete(); return;
    }
    if (cmd === '/flag' && parts.length > 2) {
      const fname = parts[1].toLowerCase();
      const msg = parts.slice(2).join(' ');
      if (flags[fname]) {
        socket.emit('sendMessage', { username, message: msg, source: sourceSelect.value, effect: `flag:${fname}`, font: fontSettings });
        input.value = ''; currentReply = null; replyBar.classList.remove('show'); hideAutocomplete(); return;
      } else addSystemMsg(`Unknown flag: ${fname}. Available: ${Object.keys(flags).join(', ')}`);
      input.value = ''; hideAutocomplete(); return;
    }
    addSystemMsg(`Unknown command: ${cmd}`);
    input.value = ''; hideAutocomplete(); return;
  }

  socket.emit('sendMessage', { username, message: text, replyTo: currentReply || undefined, source: sourceSelect.value, font: fontSettings });
  input.value = '';
  currentReply = null;
  replyBar.classList.remove('show');
  hideAutocomplete();
}

function addSystemMsg(text) {
  const div = document.createElement('div');
  div.style.cssText = 'text-align:center;color:#999;font-size:12px;padding:4px 0;font-style:italic';
  div.textContent = text;
  messagesEl.appendChild(div);
  scrollToBottom();
  setTimeout(() => { if (div.parentNode) div.remove(); }, 4000);
}

sendBtn.onclick = sendMessage;
input.onkeydown = (e) => {
  if (e.key === 'Enter' && !autocomplete.classList.contains('show') && !emoteGrid.classList.contains('show')) sendMessage();
  else if (e.key === 'Tab' && autocomplete.classList.contains('show')) { e.preventDefault(); completeCommand(); }
  else if (e.key === 'ArrowDown' && autocomplete.classList.contains('show')) { e.preventDefault(); selectedCmdIdx = Math.min(selectedCmdIdx+1, filteredCommands.length-1); updateAutocompleteSelection(); }
  else if (e.key === 'ArrowUp' && autocomplete.classList.contains('show')) { e.preventDefault(); selectedCmdIdx = Math.max(selectedCmdIdx-1, 0); updateAutocompleteSelection(); }
  else if (e.key === 'Escape') { hideAutocomplete(); emoteGrid.classList.remove('show'); }
};

input.oninput = () => {
  const text = input.value;
  const cursorPos = input.selectionStart;
  const beforeCursor = text.slice(0, cursorPos);

  const colonIdx = beforeCursor.lastIndexOf(':');
  if (colonIdx !== -1 && colonIdx === beforeCursor.length - 1) {
    showEmoteGrid('');
    return;
  }
  if (colonIdx !== -1 && beforeCursor.slice(colonIdx).length > 1 && beforeCursor.slice(colonIdx).startsWith(':')) {
    const query = beforeCursor.slice(colonIdx + 1);
    showEmoteGrid(query);
    return;
  }
  emoteGrid.classList.remove('show');

  if (beforeCursor.startsWith('/')) {
    const parts = beforeCursor.split(' ');
    if (parts.length === 1) {
      const partial = parts[0].toLowerCase();
      filteredCommands = commands.filter(c => c.cmd.startsWith(partial));
      if (filteredCommands.length > 0) { showAutocomplete(filteredCommands); selectedCmdIdx = 0; updateAutocompleteSelection(); }
      else hideAutocomplete();
    } else {
      if (parts[0] === '/flag' && parts.length === 2) {
        const partial = parts[1].toLowerCase();
        filteredCommands = Object.keys(flags).filter(f => f.startsWith(partial)).map(f => ({ cmd: `/flag ${f}`, desc: `${f} flag` }));
        if (filteredCommands.length > 0) { showAutocomplete(filteredCommands); selectedCmdIdx = 0; updateAutocompleteSelection(); }
        else hideAutocomplete();
      } else hideAutocomplete();
    }
  } else hideAutocomplete();
};

function showAutocomplete(cmds) {
  autocomplete.innerHTML = ''; autocomplete.classList.add('show');
  for (const c of cmds) {
    const item = document.createElement('div'); item.className = 'item';
    item.innerHTML = `<span style="font-weight:600;color:#000">${c.cmd}</span><span style="color:#999;margin-left:8px">${c.desc}</span>`;
    item.onclick = () => { input.value = c.cmd + ' '; input.focus(); hideAutocomplete(); };
    autocomplete.appendChild(item);
  }
}

function hideAutocomplete() { autocomplete.classList.remove('show'); autocomplete.innerHTML = ''; selectedCmdIdx = -1; }
function updateAutocompleteSelection() { autocomplete.querySelectorAll('.item').forEach((el,i) => el.classList.toggle('active', i === selectedCmdIdx)); }

function completeCommand() {
  if (filteredCommands.length === 0) return;
  const cmd = filteredCommands[selectedCmdIdx >= 0 ? selectedCmdIdx : 0];
  input.value = cmd.cmd + ' '; input.focus(); hideAutocomplete();
}

function showEmoteGrid(query) {
  const matches = emotes.filter(e => e.name.toLowerCase().includes(query.toLowerCase())).slice(0, 50);
  emoteGrid.innerHTML = '';
  if (matches.length === 0) { emoteGrid.classList.remove('show'); return; }
  emoteGrid.classList.add('show');
  for (const em of matches) {
    const item = document.createElement('div'); item.className = 'emote-item';
    const img = document.createElement('img'); img.src = em.url; img.alt = em.name; img.title = em.name;
    item.appendChild(img);
    item.onclick = () => {
      const before = input.value.slice(0, input.selectionStart);
      const after = input.value.slice(input.selectionStart);
      const colonIdx = before.lastIndexOf(':');
      input.value = before.slice(0, colonIdx) + em.name + ' ' + after;
      input.focus(); emoteGrid.classList.remove('show');
    };
    emoteGrid.appendChild(item);
  }
}
</script>
</body>
</html>
