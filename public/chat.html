<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Silkscreen&family=Pixelify+Sans&family=DotGothic16&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d1117;color:#e6edf3;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;display:flex;flex-direction:column;height:100vh}
.flag-text{background-size:200% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:flagAnim 3s linear infinite}
@keyframes flagAnim{0%{background-position:0% 50%}100%{background-position:100% 50%}}
#header{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;border-bottom:1px solid #30363d;background:#161b22;position:relative;z-index:10}
#header h1{font-size:16px;font-weight:700;color:#e6edf3}
#menu-right{display:flex;align-items:center;gap:8px}
#settings-btn{background:none;border:1px solid #30363d;border-radius:6px;padding:4px 8px;cursor:pointer;font-size:14px;color:#8b949e}
#settings-btn:hover{background:#21262d}
#nick-display{font-size:13px;color:#8b949e}
.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.status-dot.connected{background:#3fb950}
.status-dot.disconnected{background:#f85149}
#messages{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px;background:#0d1117}
.msg{display:flex;flex-direction:column;gap:2px;padding:0;max-width:85%}
.msg.own{align-items:flex-start}
.msg .bubble{background:#21262d;border-radius:12px;padding:8px 12px;font-size:14px;line-height:1.4;word-break:break-word;position:relative;transition:background .15s;color:#e6edf3}
.msg.own .bubble{background:#1c2333;border-bottom-left-radius:4px}
.msg .bubble:hover{background:#30363d}
.msg.own .bubble:hover{background:#252d3f}
.msg .badge{font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;text-transform:uppercase;letter-spacing:.3px;display:inline-block;width:fit-content}
.badge-twitch{background:#9147ff;color:#fff}
.badge-youtube{background:#ff0033;color:#fff}
.badge-discord{background:#5865f2;color:#fff}
.badge-bonebrg{background:#fff;color:#000}
.twitch-emote{vertical-align:middle;width:28px;height:28px;display:inline-block}
.msg .user{font-size:12px;font-weight:600;margin-bottom:2px;display:flex;align-items:center;gap:4px}
.msg .user .un{font-weight:700}
.msg .time{font-size:10px;color:#484f58;margin-top:2px}
.msg .reply-indicator{font-size:11px;color:#8b949e;cursor:pointer;margin-bottom:2px}
.msg .reply-indicator:hover{color:#e6edf3}
.msg .effect-tag{font-size:10px;color:#8b949e;margin-left:4px;cursor:pointer;border-bottom:1px dotted #555}
.msg .effect-tag:hover{color:#e6edf3}
#reply-bar{display:none;align-items:center;gap:8px;padding:6px 16px;background:#161b22;border-top:1px solid #30363d;font-size:13px;color:#8b949e}
#reply-bar.show{display:flex}
#reply-bar .reply-to{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#reply-bar .reply-to strong{color:#e6edf3}
#reply-bar #cancel-reply{background:none;border:none;color:#8b949e;cursor:pointer;font-size:18px;padding:0 4px}
#reply-bar #cancel-reply:hover{color:#f85149}
#input-area{display:flex;align-items:center;gap:6px;padding:8px 16px;border-top:1px solid #30363d;background:#161b22;position:relative}
#source-select{background:#0d1117;color:#e6edf3;border:1px solid #30363d;border-radius:6px;padding:6px 8px;font-size:13px;cursor:pointer;outline:none}
#msg-input{flex:1;background:#0d1117;border:1px solid #30363d;border-radius:6px;padding:8px 12px;color:#e6edf3;font-size:14px;outline:none}
#msg-input:focus{border-color:#58a6ff}
#send-btn{background:#238636;color:#fff;border:none;border-radius:6px;padding:8px 16px;font-size:14px;font-weight:600;cursor:pointer}
#send-btn:hover{background:#2ea043}
#autocomplete{display:none;position:absolute;bottom:100%;left:16px;background:#161b22;border:1px solid #30363d;border-radius:8px;overflow:hidden;min-width:220px;max-height:200px;overflow-y:auto;box-shadow:0 4px 12px rgba(0,0,0,.4)}
#autocomplete.show{display:block}
#autocomplete .item{padding:8px 12px;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:8px;color:#e6edf3}
#autocomplete .item:hover,#autocomplete .item.active{background:#21262d}
#autocomplete .item img{width:24px;height:24px;border-radius:4px}
#settings-panel{display:none;position:absolute;top:44px;right:16px;background:#161b22;border:1px solid #30363d;border-radius:8px;padding:16px;width:300px;box-shadow:0 4px 16px rgba(0,0,0,.4);z-index:100}
#settings-panel.show{display:block}
#settings-panel h3{font-size:14px;margin-bottom:12px;color:#e6edf3}
#settings-panel label{font-size:12px;color:#8b949e;display:block;margin-top:8px;margin-bottom:4px}
#settings-panel select,#settings-panel input[type=color]{width:100%;padding:6px;border:1px solid #30363d;border-radius:4px;font-size:13px;background:#0d1117;color:#e6edf3}
#settings-panel select{background:#0d1117}
#settings-panel input[type=color]{height:36px}
#settings-panel .reset-btn{width:100%;margin-top:12px;padding:8px;background:#21262d;color:#e6edf3;border:1px solid #30363d;border-radius:6px;font-size:13px;cursor:pointer}
#settings-panel .reset-btn:hover{background:#30363d}
.font-preview{margin-top:12px;padding:12px;border:1px solid #30363d;border-radius:8px;text-align:center;font-size:18px}
#emote-grid{display:none;position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:#161b22;border:1px solid #30363d;border-radius:8px;padding:8px;width:320px;max-height:200px;overflow-y:auto;box-shadow:0 4px 12px rgba(0,0,0,.4);flex-wrap:wrap;gap:4px;z-index:50}
#emote-grid.show{display:flex}
#emote-grid .emote-item{width:40px;height:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:4px}
#emote-grid .emote-item:hover{background:#21262d}
#emote-grid .emote-item img{max-width:32px;max-height:32px}
.toggle-switch{position:relative;display:inline-block;width:36px;height:20px;flex-shrink:0;cursor:pointer}
.toggle-switch input{opacity:0;width:0;height:0}
.toggle-switch .slider{position:absolute;inset:0;background:#30363d;border-radius:10px;transition:.3s}
.toggle-switch .slider::before{content:'';position:absolute;width:16px;height:16px;border-radius:50%;background:#8b949e;top:2px;left:2px;transition:.3s}
.toggle-switch input:checked + .slider{background:#238636}
.toggle-switch input:checked + .slider::before{background:#fff;transform:translateX(16px)}
#link-panel{display:none;position:absolute;top:44px;right:16px;background:#161b22;border:1px solid #30363d;border-radius:8px;padding:16px;width:300px;box-shadow:0 4px 16px rgba(0,0,0,.4);z-index:100}
#link-panel.show{display:block}
#link-panel h3{font-size:14px;margin-bottom:12px;color:#e6edf3}
#link-panel label{font-size:12px;color:#8b949e;display:block;margin-top:8px;margin-bottom:4px}
#link-panel input,#link-panel select{width:100%;padding:8px;border:1px solid #30363d;border-radius:6px;font-size:13px;background:#0d1117;color:#e6edf3;outline:none}
#link-panel input:focus,#link-panel select:focus{border-color:#58a6ff}
#link-panel .link-btn{width:100%;margin-top:10px;padding:8px;border:none;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer}
#link-panel .link-btn.link{background:#238636;color:#fff}
#link-panel .link-btn.link:hover{background:#2ea043}
#link-panel .link-btn.unlink{background:#da3633;color:#fff}
#link-panel .link-btn.unlink:hover{background:#f85149}
#link-panel .link-status{font-size:12px;margin-top:8px;padding:6px 8px;border-radius:4px;display:none}
#link-panel .link-status.ok{display:block;background:#1a3a2a;color:#3fb950}
#link-panel .link-status.err{display:block;background:#3a1a1a;color:#f85149}
#link-btn{background:none;border:1px solid #30363d;border-radius:6px;padding:4px 8px;cursor:pointer;font-size:14px;color:#8b949e}
#link-btn:hover{background:#21262d}
</style>
</head>
<body>

  <select id="font-family">

      <input type="range" id="font-shy" min="-20" max="20" step="1" value="0" style="flex:1">

</div>
<div id="link-panel">
  <h3>Account Linking</h3>
  <label>Platform</label>
  <select id="link-platform">
    <option value="twitch">Twitch</option>

</div>
<div id="messages"></div>
<div id="reply-bar">
  <span class="reply-to">Replying to <strong id="reply-user"></strong>: <span id="reply-text"></span></span>
  <button id="cancel-reply">&times;</button>
</div>
<div id="emote-grid"></div>
<div id="input-area">
  <select id="source-select">
    <option value="custom">BONEBRG</option>
    <option value="discord">Discord</option>
  </select>
  <input id="msg-input" type="text" placeholder="Type a message..." autocomplete="off">
  <button id="send-btn">Send</button>
  <div id="autocomplete"></div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
let username = localStorage.getItem('nick') || 'User';
let currentReply = null;
const commands = [
  { cmd: '/nick', desc: 'Change username', args: '<name>' },
  { cmd: '/wave', desc: 'Wavy text 5s', args: '<message>' },
  { cmd: '/rainbow', desc: 'Rainbow text 5s', args: '<message>' },
  { cmd: '/flag', desc: 'Pride flag gradient', args: '<flag> <message>' },
  { cmd: '/link', desc: 'Link Twitch/YouTube account', args: '<twitch|youtube> <user> <password>' },
  { cmd: '/unlink', desc: 'Unlink an account', args: '<twitch|youtube> <user> <password>' }
];
const flags = {
  pride: ['#ff0000','#ff8c00','#ffff00','#008000','#0000ff','#4b0082','#8b00ff'],
  trans: ['#55cdfc','#f7a8b8','#fff','#f7a8b8','#55cdfc'],
  bi: ['#d60270','#d60270','#9b4f96','#0038a8','#0038a8'],
  pan: ['#ff218c','#ffd800','#21b1ff'],
  nb: ['#fcf434','#fff','#9c59d1','#2c2c2c'],
  lesbian: ['#d52d00','#ef7627','#ff9a56','#fff','#d162a4','#b55690','#a30262'],
  ace: ['#000','#a4a4a4','#fff','#810081'],
  aro: ['#3da542','#a7d379','#fff','#a7d379','#3da542'],
  mlm: ['#078585','#98e8e8','#fff','#98e8e8','#078585'],
  genderfluid: ['#ff76a4','#fff','#bf11d','#000','#303cbe'],
  agender: ['#000','#bababa','#fff','#baf484','#fff','#bababa','#000']
};
let filteredCommands = [], selectedCmdIdx = -1;
let emotes = [];
const emoteMap = new Map();
let emotesLoaded = false;

function renderTextWithEmotes(text, nativeEmotes) {
  const nodes = [];
  const replacements = [];
  
  // 1. Pinpoint exact Twitch emotes using the provided indexes
  if (nativeEmotes) {
    for (const [id, positions] of Object.entries(nativeEmotes)) {
      for (const pos of positions) {
        const [start, end] = pos.split('-').map(Number);
        replacements.push({
          start,
          end: end + 1,
          url: `https://static-cdn.jtvnw.net/emoticons/v2/${id}/default/dark/1.0`,
          name: text.substring(start, end + 1)
        });
      }
    }
  }
  
  // Sort them so we parse the string left-to-right properly
  replacements.sort((a, b) => a.start - b.start);
  
  let currentIndex = 0;
  
  // Helper to check for 3rd-party emotes in the normal text chunks
  function parseThirdParty(chunk) {
    const parts = chunk.split(/(\s+)/);
    for (const part of parts) {
      if (!part) continue;
      const key = part.toLowerCase();
      if (emoteMap.has(key)) {
        const img = document.createElement('img');
        img.src = emoteMap.get(key);
        img.alt = part;
        img.style.cssText = 'vertical-align:middle;width:28px;height:28px;display:inline-block';
        nodes.push(img);
      } else {
        nodes.push(document.createTextNode(part));
      }
    }
  }

  // 2. Rebuild the message node by node
  for (const rep of replacements) {
    if (rep.start > currentIndex) {
      parseThirdParty(text.substring(currentIndex, rep.start));
    }
    
    const img = document.createElement('img');
    img.src = rep.url;
    img.alt = rep.name;
    img.style.cssText = 'vertical-align:middle;width:28px;height:28px;display:inline-block';
    nodes.push(img);
    
    currentIndex = rep.end;
  }
  
  if (currentIndex < text.length) {
    parseThirdParty(text.substring(currentIndex));
  }
  
  return nodes.length ? nodes : [document.createTextNode(text)];
}

function reRenderEmotes() {
  document.querySelectorAll('.bubble').forEach(el => {
    if (el.dataset.effect) return;
    const txt = el.textContent || el.innerText;
    el.innerHTML = '';
    el.append(...renderTextWithEmotes(txt));
  });
}

async function loadEmotes() {
  const sources = [
    fetch('https://api.frankerfacez.com/v1/set/global').then(r=>r.json()).then(d => {
      for (const set of Object.values(d.sets || {}))
        for (const em of set.emoticons || []) {
          const url = `https:${em.urls['1']||em.urls['2']||em.urls['4']||''}`;
          emoteMap.set(em.name.toLowerCase(), url);
          emotes.push({name:em.name, url});
        }
    }).catch(()=>{}),
    fetch('https://api.betterttv.net/3/cached/emotes/global').then(r=>r.json()).then(d => {
      for (const em of d || []) {
        emoteMap.set(em.code.toLowerCase(), `https://cdn.betterttv.net/emote/${em.id}/2x`);
        emotes.push({name:em.code, url:`https://cdn.betterttv.net/emote/${em.id}/2x`});
      }
    }).catch(()=>{}),
    fetch('https://api.frankerfacez.com/v1/room/mrpemmfub').then(r=>r.json()).then(d => {
      if (d && d.sets)
        for (const set of Object.values(d.sets))
          for (const em of set.emoticons || []) {
            const url = `https:${em.urls['1']||em.urls['2']||em.urls['4']||''}`;
            emoteMap.set(em.name.toLowerCase(), url);
            emotes.push({name:em.name, url});
          }
    }).catch(()=>{})
  ];
  const userId = await fetch('https://decapi.me/twitch/id/mrpemmfub').then(r=>r.text()).catch(()=>null);
  if (userId) {
    sources.push(
      fetch(`https://api.betterttv.net/3/cached/users/twitch/${userId}`).then(r=>r.json()).then(d => {
        for (const em of d.channelEmotes || []) {
          emoteMap.set(em.code.toLowerCase(), `https://cdn.betterttv.net/emote/${em.id}/2x`);
          emotes.push({name:em.code, url:`https://cdn.betterttv.net/emote/${em.id}/2x`});
        }
        for (const em of d.sharedEmotes || []) {
          emoteMap.set(em.code.toLowerCase(), `https://cdn.betterttv.net/emote/${em.id}/2x`);
          emotes.push({name:em.code, url:`https://cdn.betterttv.net/emote/${em.id}/2x`});
        }
      }).catch(()=>{})
    );
  }
  await Promise.all(sources);
  emotesLoaded = true;
  reRenderEmotes();
}
loadEmotes();

const DEFAULT_FONT = {fn:'Arial',fc:'#e6edf3',bg:'#21262d',ol:0,olc:'#000000',shx:0,shy:0,shb:0,shc:'#000000',sho:0};
let fontSettings = (() => {
  const raw = localStorage.getItem('font');
  if (!raw) return {...DEFAULT_FONT};
  const parsed = JSON.parse(raw);
  // migrate old select-based outline/shadow
  if (typeof parsed.ol === 'string') { parsed.ol = 0; parsed.olc = '#000000'; }
  if (typeof parsed.sh === 'string') { parsed.shx = 0; parsed.shy = 0; parsed.shb = 0; parsed.shc = '#000000'; parsed.sho = 0; delete parsed.sh; }
  return {...DEFAULT_FONT, ...parsed};
})();

const DEFAULT_USER_COLOR = {color:'#e6edf3',color2:'#58a6ff',gradient:false};
let userColorSettings = (() => {
  const raw = localStorage.getItem('userColor');
  if (!raw) return {...DEFAULT_USER_COLOR};
  return {...DEFAULT_USER_COLOR, ...JSON.parse(raw)};
})();

const messagesEl = document.getElementById('messages');
const input = document.getElementById('msg-input');
const sendBtn = document.getElementById('send-btn');
const replyBar = document.getElementById('reply-bar');
const replyUser = document.getElementById('reply-user');

function applyFontStyle(el, f) {
  const ol = f.ol > 0 ? `${f.ol}px solid ${f.olc}` : 'none';
  const hasShadow = f.shx || f.shy || f.shb;
  const sh = hasShadow ? `${f.shx||0}px ${f.shy||0}px ${f.shb||0}px ${f.shc}${f.sho < 100 ? Math.round(f.sho*2.55).toString(16).padStart(2,'0') : ''}` : 'none';
  el.style.cssText = `font-family:${f.fn};color:${f.fc};background:${f.bg};-webkit-text-stroke:${ol};text-shadow:${sh}`;
}

const outlinePresets = {
  none:        { ol: 0, olc: '#000000' },
  'thin-black':  { ol: 1, olc: '#000000' },
  'thick-black': { ol: 2, olc: '#000000' },
  'thin-white':  { ol: 1, olc: '#ffffff' },
  'thick-white': { ol: 2, olc: '#ffffff' },
};
const shadowPresets = {
  none:        { shx: 0, shy: 0, shb: 0, sho: 0 },
  soft:        { shx: 1, shy: 1, shb: 2, sho: 30 },
  medium:      { shx: 2, shy: 2, shb: 4, sho: 40 },
  strong:      { shx: 3, shy: 3, shb: 6, sho: 50 },
  'soft-light': { shx: 1, shy: 1, shb: 2, sho: 50, shc: '#ffffff' },
};

function presetToKey(p) { return p === 'custom' ? 'custom' : Object.keys(outlinePresets).includes(p) ? 'ol' : 'sh'; }

const EFFECT_DURATION = 5000;
const FADE_DURATION = 1000;

function renderTextWithEmotes(text, nativeEmotes) {
  // 1. Dynamically extract native Twitch emotes and add them to the map
  if (nativeEmotes) {
    for (const [id, positions] of Object.entries(nativeEmotes)) {
      if (positions.length > 0) {
        // Grab the start and end index of the emote's first occurrence
        const [start, end] = positions[0].split('-').map(Number);
        const emoteName = text.substring(start, end + 1);
        
        // Map the extracted name to Twitch's official v2 emote CDN
        emoteMap.set(emoteName.toLowerCase(), `https://static-cdn.jtvnw.net/emoticons/v2/${id}/default/dark/1.0`);
      }
    }
  }

  // 2. Your existing rendering logic
  const parts = text.split(/(\s+)/);
  const nodes = [];
  for (const part of parts) {
    const key = part.toLowerCase();
    if (emoteMap.has(key)) {
      const img = document.createElement('img');
      img.src = emoteMap.get(key);
      img.alt = part;
      img.title = part; // Optional: adds a hover tooltip for accessibility 
      img.style.cssText = 'vertical-align:middle;width:28px;height:28px;display:inline-block';
      nodes.push(img);
    } else {
      nodes.push(document.createTextNode(part));
    }
  }
  return nodes.length ? nodes : [document.createTextNode(text)];
}

function appendMessage(msg, scroll) {
  const div = document.createElement('div');
  div.className = 'msg own';
  div.dataset.id = msg.id;
  if (msg.color) div.style.setProperty('--twitch-color', msg.color);

  const userRow = document.createElement('div');
  userRow.className = 'user';
  const badge = document.createElement('span');
  const src = msg.source === 'custom' ? 'bonebrg' : msg.source;
  badge.className = `badge badge-${src}`;
  badge.textContent = msg.source === 'custom' ? 'BONEBRG' : msg.source;
  userRow.appendChild(badge);

  if (msg.replyTo) {
    const rp = document.createElement('span');
    rp.className = 'reply-indicator';
    const preview = msg.replyTo.message.length > 30 ? msg.replyTo.message.slice(0,30) + '...' : msg.replyTo.message;
    rp.textContent = `↩ ${msg.replyTo.username}: ${preview}`;
    rp.title = msg.replyTo.message;
    userRow.appendChild(rp);
  }

  const un = document.createElement('span');
  un.className = 'un';
  un.textContent = msg.username;
  if (msg.userColor) {
    if (msg.userColor.gradient && msg.userColor.color2) {
      un.style.background = `linear-gradient(90deg, ${msg.userColor.color}, ${msg.userColor.color2})`;
      un.style.webkitBackgroundClip = 'text';
      un.style.webkitTextFillColor = 'transparent';
      un.style.backgroundClip = 'text';
    } else {
      un.style.color = msg.userColor.color;
    }
  } else if (msg.source === 'twitch' && msg.color) un.style.color = msg.color;
  userRow.appendChild(un);
  if (msg.linked) {
    const li = document.createElement('span');
    li.textContent = '⛓';
    li.style.cssText = 'font-size:10px;margin-left:3px;opacity:.5';
    userRow.appendChild(li);
  }

  const tm = document.createElement('span');
  tm.className = 'time';
  const d = new Date(msg.timestamp);
  tm.textContent = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  userRow.appendChild(tm);
  div.appendChild(userRow);

  const bubble = document.createElement('div');
  bubble.className = 'bubble';

  if (msg.effect) {
    if (msg.effect === 'wave') {
      bubble.dataset.effect = 'wave';
      applyWave(bubble, msg.message);
    } else if (msg.effect === 'rainbow') {
      bubble.dataset.effect = 'rainbow';
      applyRainbow(bubble, msg.message);
    } else if (msg.effect.startsWith('flag:')) {
      bubble.dataset.effect = msg.effect;
      applyFlag(bubble, msg.message, msg.effect.replace('flag:', ''));
    }
    else {
    if (msg.parsedHtml) { bubble.innerHTML = msg.parsedHtml; }
    else { const textNodes = renderTextWithEmotes(msg.message, msg.emotes); bubble.append(...textNodes); }
  }
    const tag = document.createElement('span');
    tag.className = 'effect-tag';
    tag.textContent = msg.effect.startsWith('flag:') ? msg.effect.replace('flag:','') : msg.effect;
    tag.onclick = () => replayEffect(bubble, msg.effect, msg.message);
    bubble.appendChild(tag);
  } else {
    if (msg.parsedHtml) { bubble.innerHTML = msg.parsedHtml; }
    else { const textNodes = renderTextWithEmotes(msg.message, msg.emotes); bubble.append(...textNodes); }
  }

  if (msg.font) applyFontStyle(bubble, msg.font);

  const rb = document.createElement('span');
  rb.style.cssText = 'font-size:11px;color:#8b949e;cursor:pointer;margin-top:2px';
  rb.textContent = '↩ reply';
  rb.onclick = () => setReply(msg);

  div.appendChild(bubble);
  div.appendChild(rb);
  messagesEl.appendChild(div);
  if (scroll) scrollToBottom();
}

function stopEffect(el) {
  if (el._effectTimer) { cancelAnimationFrame(el._effectTimer); el._effectTimer = null; }
}

function applyWave(el, text) {
  stopEffect(el);
  el.innerHTML = '';
  const spans = [];
  for (let i = 0; i < text.length; i++) {
    const sp = document.createElement('span');
    sp.textContent = text[i] === ' ' ? '\u00A0' : text[i];
    sp.style.display = 'inline-block';
    el.appendChild(sp);
    spans.push(sp);
  }
  const startTime = performance.now();
  function frame(t) {
    const elapsed = t - startTime;
    const remaining = Math.max(0, EFFECT_DURATION - elapsed);
    const amp = 6 * Math.min(remaining / FADE_DURATION, 1);
    for (let i = 0; i < spans.length; i++) {
      const phase = (elapsed / 1000 + i * 0.08) / 0.4 * Math.PI * 2;
      spans[i].style.transform = `translateY(${Math.sin(phase) * amp}px)`;
    }
    if (elapsed < EFFECT_DURATION) {
      el._effectTimer = requestAnimationFrame(frame);
    } else {
      el.innerHTML = text;
    }
  }
  el._effectTimer = requestAnimationFrame(frame);
}

function applyRainbow(el, text) {
  stopEffect(el);
  el.innerHTML = '';
  const spans = [];
  for (let i = 0; i < text.length; i++) {
    const sp = document.createElement('span');
    sp.textContent = text[i] === ' ' ? '\u00A0' : text[i];
    el.appendChild(sp);
    spans.push(sp);
  }
  const startTime = performance.now();
  function frame(t) {
    const elapsed = t - startTime;
    const remaining = Math.max(0, EFFECT_DURATION - elapsed);
    const fade = Math.min(remaining / FADE_DURATION, 1);
    const sat = 100 * fade + '%';
    const light = 35 + 20 * fade;
    for (let i = 0; i < spans.length; i++) {
      const hue = ((i / spans.length) * 360 + elapsed / 1000 * 120) % 360;
      spans[i].style.color = `hsl(${hue}, ${sat}, ${light}%)`;
    }
    if (elapsed < EFFECT_DURATION) {
      el._effectTimer = requestAnimationFrame(frame);
    } else {
      el.innerHTML = text;
    }
  }
  el._effectTimer = requestAnimationFrame(frame);
}

function applyFlag(el, text, fname) {
  stopEffect(el);
  const cols = flags[fname] || flags.pride;
  el.innerHTML = '';
  const spans = [];
  for (let i = 0; i < text.length; i++) {
    const sp = document.createElement('span');
    sp.textContent = text[i] === ' ' ? '\u00A0' : text[i];
    el.appendChild(sp);
    spans.push(sp);
  }
  const startTime = performance.now();
  function frame(t) {
    const elapsed = t - startTime;
    const remaining = Math.max(0, EFFECT_DURATION - elapsed);
    const fade = Math.min(remaining / FADE_DURATION, 1);
    const offset = Math.floor(elapsed / 300) % cols.length;
    for (let i = 0; i < spans.length; i++) {
      const ci = (i + offset) % cols.length;
      spans[i].style.color = cols[ci];
      spans[i].style.opacity = fade;
    }
    if (elapsed < EFFECT_DURATION) {
      el._effectTimer = requestAnimationFrame(frame);
    } else {
      el.innerHTML = text;
    }
  }
  el._effectTimer = requestAnimationFrame(frame);
}

function replayEffect(el, effect, msgText) {
  if (!msgText) {
    const parts = el.textContent.split(/\[.*?\]/);
    msgText = parts[0] ? parts[0].trim() : (el.textContent || '');
  }
  if (effect === 'wave') { applyWave(el, msgText); }
  else if (effect === 'rainbow') { applyRainbow(el, msgText); }
  else if (effect && effect.startsWith('flag:')) { applyFlag(el, msgText, effect.replace('flag:', '')); }
}

function sendMessage() {
  let text = input.value.trim();
  if (!text) return;

  if (text.startsWith('/')) {
    const parts = text.split(' ');
    const cmd = parts[0].toLowerCase();
    if (cmd === '/nick') {
      if (parts[1]) {
        username = parts[1];
        nickDisplay.textContent = username;
        localStorage.setItem('nick', username);
        socket.emit('command', { command: 'nick', args: username });
        addSystemMsg(`Nick changed to ${username}`);
      } else addSystemMsg('Usage: /nick <username>');
      input.value = ''; hideAutocomplete(); return;
    }
    if (cmd === '/wave' && parts.length > 1) {
      const msg = parts.slice(1).join(' ');
      socket.emit('sendMessage', { username, message: msg, source: sourceSelect.value, effect: 'wave', font: fontSettings, userColor: userColorSettings });
      input.value = ''; currentReply = null; replyBar.classList.remove('show'); hideAutocomplete(); return;
    }
    if (cmd === '/rainbow' && parts.length > 1) {
      const msg = parts.slice(1).join(' ');
      socket.emit('sendMessage', { username, message: msg, source: sourceSelect.value, effect: 'rainbow', font: fontSettings, userColor: userColorSettings });
      input.value = ''; currentReply = null; replyBar.classList.remove('show'); hideAutocomplete(); return;
    }
    if (cmd === '/flag' && parts.length > 2) {
      const fname = parts[1].toLowerCase();
      const msg = parts.slice(2).join(' ');
      if (flags[fname]) {
        socket.emit('sendMessage', { username, message: msg, source: sourceSelect.value, effect: `flag:${fname}`, font: fontSettings, userColor: userColorSettings });
        input.value = ''; currentReply = null; replyBar.classList.remove('show'); hideAutocomplete(); return;
      } else addSystemMsg(`Unknown flag: ${fname}. Available: ${Object.keys(flags).join(', ')}`);
      input.value = ''; hideAutocomplete(); return;
    }
    if (cmd === '/link') {
      if (parts.length >= 4) {
        socket.emit('link:link', { platform: parts[1].toLowerCase(), username: parts[2], password: parts[3], nick: username, font: fontSettings });
        input.value = ''; hideAutocomplete(); return;
      } else { linkPanel.classList.toggle('show'); settingsPanel.classList.remove('show'); input.value = ''; hideAutocomplete(); return; }
    }
    if (cmd === '/unlink') {
      if (parts.length >= 4) {
        socket.emit('link:unlink', { platform: parts[1].toLowerCase(), username: parts[2], password: parts[3] });
        input.value = ''; hideAutocomplete(); return;
      } else { linkPanel.classList.toggle('show'); settingsPanel.classList.remove('show'); input.value = ''; hideAutocomplete(); return; }
    }
    addSystemMsg(`Unknown command: ${cmd}`);
    input.value = ''; hideAutocomplete(); return;
  }

  socket.emit('sendMessage', { username, message: text, replyTo: currentReply || undefined, source: sourceSelect.value, font: fontSettings, userColor: userColorSettings });
  input.value = '';
  currentReply = null;
  replyBar.classList.remove('show');
  hideAutocomplete();
}

function addSystemMsg(text) {
  const div = document.createElement('div');
  div.style.cssText = 'text-align:center;color:#8b949e;font-size:12px;padding:4px 0;font-style:italic';
  div.textContent = text;
  messagesEl.appendChild(div);
  scrollToBottom();
  setTimeout(() => { if (div.parentNode) div.remove(); }, 4000);
}

sendBtn.onclick = sendMessage;
input.onkeydown = (e) => {
  if (e.key === 'Enter' && !autocomplete.classList.contains('show') && !emoteGrid.classList.contains('show')) sendMessage();
  else if ((e.key === 'Tab' || e.key === ' ') && autocomplete.classList.contains('show')) { e.preventDefault(); completeCommand(); }
  else if (e.key === 'ArrowDown' && autocomplete.classList.contains('show')) { e.preventDefault(); selectedCmdIdx = Math.min(selectedCmdIdx+1, filteredCommands.length-1); updateAutocompleteSelection(); }
  else if (e.key === 'ArrowUp' && autocomplete.classList.contains('show')) { e.preventDefault(); selectedCmdIdx = Math.max(selectedCmdIdx-1, 0); updateAutocompleteSelection(); }
  else if (e.key === 'Escape') { hideAutocomplete(); emoteGrid.classList.remove('show'); }
};

input.oninput = () => {
  const text = input.value;
  const cursorPos = input.selectionStart;
  const beforeCursor = text.slice(0, cursorPos);

  const colonIdx = beforeCursor.lastIndexOf(':');
  if (colonIdx !== -1 && colonIdx === beforeCursor.length - 1) {
    showEmoteGrid('');
    return;
  }
  if (colonIdx !== -1 && beforeCursor.slice(colonIdx).length > 1 && beforeCursor.slice(colonIdx).startsWith(':')) {
    const query = beforeCursor.slice(colonIdx + 1);
    showEmoteGrid(query);
    return;
  }
  emoteGrid.classList.remove('show');

  if (beforeCursor.startsWith('/')) {
    const parts = beforeCursor.split(' ');
    if (parts.length === 1) {
      const partial = parts[0].toLowerCase();
      filteredCommands = commands.filter(c => c.cmd.startsWith(partial));
      if (filteredCommands.length > 0) { showAutocomplete(filteredCommands); selectedCmdIdx = 0; updateAutocompleteSelection(); }
      else hideAutocomplete();
    } else {
      if (parts[0] === '/flag' && parts.length === 2) {
        const partial = parts[1].toLowerCase();
        filteredCommands = Object.keys(flags).filter(f => f.startsWith(partial)).map(f => ({ cmd: `/flag ${f}`, desc: `${f} flag` }));
        if (filteredCommands.length > 0) { showAutocomplete(filteredCommands); selectedCmdIdx = 0; updateAutocompleteSelection(); }
        else hideAutocomplete();
      } else hideAutocomplete();
    }
  } else hideAutocomplete();
};

function showAutocomplete(cmds) {
  autocomplete.innerHTML = ''; autocomplete.classList.add('show');
  for (const c of cmds) {
    const item = document.createElement('div'); item.className = 'item';
    item.innerHTML = `<span style="font-weight:600;color:#e6edf3">${c.cmd}</span><span style="color:#8b949e;margin-left:8px">${c.desc}</span>`;
    item.onclick = () => { input.value = c.cmd + ' '; input.focus(); hideAutocomplete(); };
    autocomplete.appendChild(item);
  }
}

function hideAutocomplete() { autocomplete.classList.remove('show'); autocomplete.innerHTML = ''; selectedCmdIdx = -1; }
function updateAutocompleteSelection() { autocomplete.querySelectorAll('.item').forEach((el,i) => el.classList.toggle('active', i === selectedCmdIdx)); }

function completeCommand() {
  if (filteredCommands.length === 0) return;
  const cmd = filteredCommands[selectedCmdIdx >= 0 ? selectedCmdIdx : 0];
  input.value = cmd.cmd + ' '; input.focus(); hideAutocomplete();
}

function showEmoteGrid(query) {
  const matches = emotes.filter(e => e.name.toLowerCase().includes(query.toLowerCase())).slice(0, 50);
  emoteGrid.innerHTML = '';
  if (matches.length === 0) { emoteGrid.classList.remove('show'); return; }
  emoteGrid.classList.add('show');
  for (const em of matches) {
    const item = document.createElement('div'); item.className = 'emote-item';
    const img = document.createElement('img'); img.src = em.url; img.alt = em.name; img.title = em.name;
    item.appendChild(img);
    item.onclick = () => {
      const before = input.value.slice(0, input.selectionStart);
      const after = input.value.slice(input.selectionStart);
      const colonIdx = before.lastIndexOf(':');
      input.value = before.slice(0, colonIdx) + em.name + ' ' + after;
      input.focus(); emoteGrid.classList.remove('show');
    };
    emoteGrid.appendChild(item);
  }
}
</script>
</body>
</html>
